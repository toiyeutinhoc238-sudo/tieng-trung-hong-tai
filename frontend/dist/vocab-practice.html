  <script>
    (function () {
      var t = localStorage.getItem('theme') || 'dark';
      var bgUrl = t === 'light' ? "url('/assets/app_bg_day_v3.png')" : "url('/assets/app_bg_night_v3.png')";
      document.documentElement.style.setProperty('background-image', bgUrl, 'important');
      document.documentElement.style.setProperty('background-size', 'cover', 'important');
      document.documentElement.style.setProperty('background-position', 'center center', 'important');
      document.documentElement.style.setProperty('background-attachment', 'fixed', 'important');
      document.documentElement.style.setProperty('background-repeat', 'no-repeat', 'important');

      if (t === 'light') {
        document.documentElement.classList.add('light-mode', 'light');
        document.documentElement.classList.remove('dark');
        if (document.body) {
          document.body.classList.add('light-mode');
          document.body.style.setProperty('background-image', bgUrl, 'important');
        } else {
          document.addEventListener('DOMContentLoaded', function () {
            document.body.classList.add('light-mode');
            document.body.style.setProperty('background-image', bgUrl, 'important');
          });
        }
      } else {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light', 'light-mode');
        if (document.body) {
          document.body.classList.remove('light-mode', 'light');
          document.body.classList.add('dark');
        } else {
          document.addEventListener('DOMContentLoaded', function () {
            document.body.classList.add('dark');
            document.body.style.setProperty('background-image', bgUrl, 'important');
          });
        }
      }
    })();

    window.toggleTheme = function () {
      var isLight = document.documentElement.classList.contains('light-mode') || document.documentElement.classList.contains('light');
      var nextDark = isLight;
      var bgUrl = nextDark ? "url('/assets/app_bg_night_v3.png')" : "url('/assets/app_bg_day_v3.png')";

      document.documentElement.style.setProperty('background-image', bgUrl, 'important');
      document.documentElement.style.setProperty('background-size', 'cover', 'important');
      document.documentElement.style.setProperty('background-position', 'center center', 'important');
      document.documentElement.style.setProperty('background-attachment', 'fixed', 'important');
      document.documentElement.style.setProperty('background-repeat', 'no-repeat', 'important');

      if (document.body) {
        document.body.style.setProperty('background-image', bgUrl, 'important');
        document.body.style.setProperty('background-size', 'cover', 'important');
        document.body.style.setProperty('background-position', 'center center', 'important');
        document.body.style.setProperty('background-attachment', 'fixed', 'important');
        document.body.style.setProperty('background-repeat', 'no-repeat', 'important');
      }

      if (nextDark) {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light', 'light-mode');
        if (document.body) {
          document.body.classList.remove('light-mode', 'light');
          document.body.classList.add('dark');
        }
        localStorage.setItem('theme', 'dark');
        updateToggleBtns(false);
      } else {
        document.documentElement.classList.add('light', 'light-mode');
        document.documentElement.classList.remove('dark');
        if (document.body) {
          document.body.classList.remove('dark');
          document.body.classList.add('light-mode');
        }
        localStorage.setItem('theme', 'light');
        updateToggleBtns(true);
      }
    };

    function updateToggleBtns(isLight) {
      var btns = document.querySelectorAll('#theme-toggle, #theme-toggle-btn, .theme-toggle-btn');
      btns.forEach(function (btn) {
        btn.innerHTML = isLight
          ? '<i class="fa-solid fa-sun" style="color:#f59e0b;"></i>'
          : '<i class="fa-solid fa-moon" style="color:#60a5fa;"></i>';
      });
    }
  </script>

  <script>
    let allVocab = [];
    let currentLessonWords = [];
    let currentLevel = 1;
    let currentVersion = '3.0';
    let currentLessonId = 1;
    let currentMode = 'listen'; // 'listen' | 'match' | 'unscramble' | 'cloze' | 'sentence'
    let currentWordIndex = 0;
    let matchingState = { selectedZh: null, selectedVi: null, matchedPairs: [] };

    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      currentLevel = parseInt(params.get('level'), 10) || 1;
      currentLessonId = parseInt(params.get('lesson'), 10) || 1;
      currentVersion = params.get('version') || localStorage.getItem('active_hsk_version') || '3.0';

      const lvlSel = document.getElementById('level-switcher-select');
      if (lvlSel) {
        lvlSel.innerHTML = `
          <option value="1">HSK 1 (${currentVersion === '2.0' ? '2.0' : '3.0'})</option>
          <option value="2">HSK 2 (${currentVersion === '2.0' ? '2.0' : '3.0'})</option>
          <option value="3">HSK 3 (${currentVersion === '2.0' ? '2.0' : '3.0'})</option>
        `;
        lvlSel.value = String(currentLevel);
      }

      await loadVocabularyData();
      renderWorkspace();
    });

    async function loadVocabularyData() {
      try {
        const token = localStorage.getItem('session_token');
        const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
        const res = await fetch('/api/vocabulary', { headers });
        if (res.ok) {
          allVocab = await res.json();
        } else {
          allVocab = [];
        }
      } catch (err) {
        console.warn('Load vocab failed, falling back:', err);
        allVocab = [];
      }

      filterCurrentLessonWords();
      populateLessonSwitcher();
    }

    function filterCurrentLessonWords() {
      currentLessonWords = allVocab.filter(w => {
        if (!w || !w.word) return false;
        const matchLvl = String(w.level) === String(currentLevel);
        const matchVer = (w.hskVersion || '3.0') === currentVersion || w.isCustom;
        const numId = parseInt(String(w.lessonId || 1).replace(/\D/g, ''), 10) || 1;
        return matchLvl && matchVer && numId === currentLessonId;
      });

      if (currentLessonWords.length === 0) {
        currentLessonWords = allVocab.filter(w => String(w.level) === String(currentLevel)).slice(0, 15);
      }

      const countBadge = document.getElementById('vocab-count-badge');
      if (countBadge) {
        countBadge.textContent = `${currentLessonWords.length} từ vựng`;
      }
    }

    function populateLessonSwitcher() {
      const lesSel = document.getElementById('lesson-switcher-select');
      if (!lesSel) return;

      const lessonsMap = new Map();
      allVocab.filter(w => String(w.level) === String(currentLevel) && (w.hskVersion || '3.0') === currentVersion).forEach(w => {
        const numId = parseInt(String(w.lessonId || 1).replace(/\D/g, ''), 10) || 1;
        if (!lessonsMap.has(numId)) {
          lessonsMap.set(numId, w.lessonTitle || `Bài ${numId}`);
        }
      });

      if (lessonsMap.size === 0) {
        for (let i = 1; i <= 15; i++) lessonsMap.set(i, `Bài ${i}`);
      }

      lesSel.innerHTML = Array.from(lessonsMap.entries()).map(([num, title]) => {
        const isSel = num === currentLessonId ? 'selected' : '';
        return `<option value="${num}" ${isSel}>${title}</option>`;
      }).join('');
    }

    function switchVocabLevel(lvl) {
      currentLevel = parseInt(lvl, 10) || 1;
      currentLessonId = 1;
      currentWordIndex = 0;
      updateUrlParams();
      filterCurrentLessonWords();
      populateLessonSwitcher();
      renderWorkspace();
    }

    function switchVocabLesson(lesId) {
      currentLessonId = parseInt(lesId, 10) || 1;
      currentWordIndex = 0;
      updateUrlParams();
      filterCurrentLessonWords();
      renderWorkspace();
    }

    function updateUrlParams() {
      const url = new URL(window.location);
      url.searchParams.set('level', currentLevel);
      url.searchParams.set('lesson', currentLessonId);
      url.searchParams.set('version', currentVersion);
      window.history.replaceState({}, '', url);
    }

    function switchVocabMode(mode) {
      currentMode = mode;
      matchingState = { selectedZh: null, selectedVi: null, matchedPairs: [] };

      ['listen', 'match', 'unscramble', 'cloze', 'sentence'].forEach(m => {
        const btn = document.getElementById(`mode-btn-${m}`);
        if (btn) {
          if (m === currentMode) btn.classList.add('active');
          else btn.classList.remove('active');
        }
      });

      renderWorkspace();
    }

    function speakWord(text) {
      if (!text) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN';
        u.rate = 0.88;
        window.speechSynthesis.speak(u);
      }
    }

    // ROBUST VOCABULARY PROGRESS TRACKING
    function recordVocabResult(wordOrObj, isCorrect) {
      if (!wordOrObj) return;
      const targetObj = typeof wordOrObj === 'object' ? wordOrObj : currentLessonWords.find(w => w.word === wordOrObj) || { word: wordOrObj };
      const word = (targetObj.word || targetObj.char || '').trim();
      const id = targetObj.id || word;
      const pinyin = (targetObj.pinyin || '').trim();
      const meaning = (targetObj.meaning || '').trim();

      let userKeys = ['guest'];
      try {
        const stored = localStorage.getItem('user');
        if (stored) {
          const u = JSON.parse(stored);
          if (u) {
            if (u._id) userKeys.push(String(u._id));
            if (u.id) userKeys.push(String(u.id));
            if (u.email) userKeys.push(String(u.email));
          }
        }
      } catch (e) {}

      userKeys = Array.from(new Set(userKeys.filter(Boolean)));

      const progState = {
        isStudied: true,
        isMemorized: !!isCorrect,
        isWrong: !isCorrect,
        word: word,
        pinyin: pinyin,
        meaning: meaning,
        level: targetObj.level || currentLevel,
        updatedAt: Date.now()
      };

      userKeys.forEach(k => {
        try {
          const storageKey = `user_progress_${k}`;
          const currentData = JSON.parse(localStorage.getItem(storageKey) || '{}');
          if (id) currentData[id] = { ...(currentData[id] || {}), ...progState };
          if (id) currentData[String(id)] = { ...(currentData[String(id)] || {}), ...progState };
          if (word) currentData[word] = { ...(currentData[word] || {}), ...progState };
          localStorage.setItem(storageKey, JSON.stringify(currentData));
        } catch (e) {}
      });

      try {
        const guestData = JSON.parse(localStorage.getItem('guest_progress') || '{}');
        if (id) guestData[id] = { ...(guestData[id] || {}), ...progState };
        if (id) guestData[String(id)] = { ...(guestData[String(id)] || {}), ...progState };
        if (word) guestData[word] = { ...(guestData[word] || {}), ...progState };
        localStorage.setItem('guest_progress', JSON.stringify(guestData));
      } catch (e) {}

      // Notify parent/opener
      const payload = {
        type: 'WORD_PROGRESS_UPDATED',
        wordId: id,
        word: word,
        isCorrect: !!isCorrect,
        isWrong: !isCorrect,
        isMemorized: !!isCorrect,
        isStudied: true
      };
      try {
        if (window.parent && window.parent !== window) window.parent.postMessage(payload, '*');
        if (window.opener && !window.opener.closed) window.opener.postMessage(payload, '*');
      } catch (e) {}

      // Backend sync
      try {
        const token = localStorage.getItem('session_token');
        const headers = { 'Content-Type': 'application/json' };
        if (token) {
          headers['Authorization'] = `Bearer ${token}`;
          headers['x-session-token'] = token;
        }
        if (!isCorrect) {
          fetch(API_BASE_URL + '/api/vocabulary/set-wrong', {
            method: 'POST',
            headers,
            body: JSON.stringify({ id, isWrong: true }),
            credentials: 'include'
          }).catch(() => {});
        } else {
          fetch(API_BASE_URL + '/api/vocabulary/set-memorized', {
            method: 'POST',
            headers,
            body: JSON.stringify({ id, isMemorized: true }),
            credentials: 'include'
          }).catch(() => {});
        }
      } catch (e) {}
    }

    function handleVocabSuddenExit() {
      if (currentLessonWords && currentLessonWords.length > 0) {
        const curWord = currentLessonWords[currentWordIndex % currentLessonWords.length];
        if (curWord) {
          recordVocabResult(curWord, false);
        }
      }
    }
    window.addEventListener('beforeunload', handleVocabSuddenExit);
    window.addEventListener('pagehide', handleVocabSuddenExit);

    function renderWorkspace() {
      const box = document.getElementById('vocab-workspace');
      if (!box) return;

      if (!currentLessonWords || currentLessonWords.length === 0) {
        box.innerHTML = `
          <div style="text-align:center; padding:40px; color:#94a3b8;">
            <i class="fa-solid fa-triangle-exclamation" style="font-size:2rem; color:#f59e0b; margin-bottom:12px;"></i>
            <div>Chưa có dữ liệu từ vựng cho Bài ${currentLessonId} HSK ${currentLevel}.</div>
          </div>
        `;
        return;
      }

      if (currentMode === 'listen') {
        renderListenQuizMode(box);
      } else if (currentMode === 'match') {
        renderMatchingMode(box);
      } else if (currentMode === 'unscramble') {
        renderUnscrambleMode(box);
      } else if (currentMode === 'cloze') {
        renderSentenceClozeMode(box);
      } else if (currentMode === 'sentence') {
        renderSentenceAiMode(box);
      }
    }

    // 1. NGHE XONG CHỌN ĐÁP ÁN
    function renderListenQuizMode(box) {
      const curWord = currentLessonWords[currentWordIndex % currentLessonWords.length];
      const otherWords = currentLessonWords.filter(w => w.word !== curWord.word);
      const distractors = otherWords.sort(() => Math.random() - 0.5).slice(0, 3);
      
      const rawOptions = [curWord, ...distractors].sort(() => Math.random() - 0.5);

      box.innerHTML = `
        <div style="max-width:700px; margin:0 auto; text-align:center;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <span style="font-weight:800; font-size:0.95rem; color:#38bdf8;">
              <i class="fa-solid fa-headphones"></i> Câu ${currentWordIndex + 1} / ${currentLessonWords.length}
            </span>
            <span style="font-weight:800; font-size:0.9rem; color:#fbbf24;">
              Dạng 1: Nghe Chọn Đáp Án
            </span>
          </div>

          <!-- Audio Listening Hero Dịu Mắt -->
          <div class="practice-prompt-card" style="padding:32px;">
            <div class="prompt-title" style="font-size:1.05rem; font-weight:700; margin-bottom:18px;">
              Bấm nút loa bên dưới để nghe phát âm, sau đó chọn nghĩa tiếng Việt đúng:
            </div>

            <button onclick="speakWord('${curWord.word}')" class="practice-btn practice-btn-primary" style="padding:16px 36px; border-radius:99px; font-size:1.15rem; box-shadow:0 8px 25px rgba(2,132,199,0.35);">
              <i class="fa-solid fa-volume-high" style="font-size:1.35rem;"></i> BẤM ĐỂ NGHE PHÁT ÂM
            </button>
          </div>

          <!-- Options Grid -->
          <div style="display:flex; flex-direction:column; gap:12px; margin-bottom:24px;">
            ${rawOptions.map((opt, idx) => `
              <button class="ans-opt-btn" onclick="checkListenAnswer('${opt.word}', '${curWord.word}', this)" style="text-align:left; display:flex; justify-content:space-between; align-items:center;">
                <span>${String.fromCharCode(65 + idx)}. ${opt.meaning}</span>
                <i class="fa-solid fa-circle-check opt-icon" style="opacity:0;"></i>
              </button>
            `).join('')}
          </div>

          <div id="listen-feedback" style="min-height:32px; margin-bottom:18px; font-weight:800; font-size:1.05rem;"></div>

          <div style="display:flex; justify-content:space-between; gap:12px;">
            <button onclick="navWord(-1)" class="practice-btn practice-btn-neutral">
              &larr; Từ trước
            </button>
            <button onclick="navWord(1)" class="practice-btn practice-btn-primary">
              Từ tiếp theo &rarr;
            </button>
          </div>
        </div>
      `;

      setTimeout(() => speakWord(curWord.word), 350);
    }

    function checkListenAnswer(selectedWord, correctWord, btnEl) {
      const feed = document.getElementById('listen-feedback');
      if (selectedWord === correctWord) {
        recordVocabResult(correctWord, true);
        btnEl.style.background = 'rgba(16, 185, 129, 0.2)';
        btnEl.style.borderColor = '#10b981';
        btnEl.style.color = '#10b981';
        const icon = btnEl.querySelector('.opt-icon');
        if (icon) { icon.style.opacity = '1'; icon.style.color = '#10b981'; }
        if (feed) feed.innerHTML = `<div class="feedback-badge feedback-badge-success"><i class="fa-solid fa-circle-check"></i> Chính xác! (${correctWord})</div>`;
        speakWord(correctWord);
      } else {
        recordVocabResult(correctWord, false);
        btnEl.style.background = 'rgba(239, 68, 68, 0.2)';
        btnEl.style.borderColor = '#ef4444';
        btnEl.style.color = '#ef4444';
        if (feed) feed.innerHTML = `<div class="feedback-badge feedback-badge-error"><i class="fa-solid fa-circle-xmark"></i> Chưa đúng, thử nghe lại nhé!</div>`;
      }
    }

    // 2. BÀI TẬP NỐI TỪ VỚI NGHĨA
    function escapeMatchStr(str) {
      return String(str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function renderMatchingMode(box, batchIndex = 0) {
      if (!currentLessonWords || currentLessonWords.length === 0) {
        box.innerHTML = `<div style="text-align:center; padding:40px; color:#94a3b8;">Không có từ vựng nào trong bài học này!</div>`;
        return;
      }

      const batchSize = 6;
      const totalWords = currentLessonWords.length;
      const safeBatchIndex = Math.max(0, batchIndex);
      const startIdx = (safeBatchIndex * batchSize) % totalWords;
      let batchWords = currentLessonWords.slice(startIdx, startIdx + batchSize);
      if (batchWords.length < batchSize && totalWords >= batchSize) {
        batchWords = currentLessonWords.slice(Math.max(0, totalWords - batchSize));
      }

      // Xáo trộn nghĩa tiếng Việt ban đầu
      const shuffledMeanings = [...batchWords].sort(() => Math.random() - 0.5);

      matchingState = {
        batchIndex: safeBatchIndex,
        batchWords: batchWords,
        selectedZh: null,
        selectedVi: null,
        matchedList: [], // Danh sách các cặp đã ghép đúng, sẽ hiển thị cùng hàng trên cùng
        unmatchedZh: [...batchWords],
        unmatchedVi: [...shuffledMeanings]
      };

      box.innerHTML = `
        <div style="max-width:850px; margin:0 auto;">
          <div style="text-align:center; margin-bottom:20px;">
            <h3 style="font-size:1.35rem; font-weight:800; color:#fbbf24; margin-bottom:6px;">
              <i class="fa-solid fa-link"></i> BÀI TẬP NỐI TỪ VỚI NGHĨA
            </h3>
            <p style="color:var(--text-secondary, #cbd5e1); font-size:0.92rem;">
              Bấm chọn 1 từ ở <strong>Cột Chữ Hán</strong> và 1 nghĩa ở <strong>Cột Nghĩa Tiếng Việt</strong> tương ứng. Khi nối đúng, 2 từ sẽ tự động xếp lên cùng hàng!
            </p>
          </div>

          <div class="matching-grid" id="matching-grid-container">
            <!-- Cột Chữ Hán -->
            <div style="display:flex; flex-direction:column; gap:12px;">
              <div class="matching-col-header zh-header">
                <i class="fa-solid fa-font"></i> Cột A: Chữ Hán
              </div>
              <div id="matching-col-zh-cards" style="display:flex; flex-direction:column; gap:12px;"></div>
            </div>

            <!-- Cột Nghĩa Tiếng Việt -->
            <div style="display:flex; flex-direction:column; gap:12px;">
              <div class="matching-col-header vi-header">
                <i class="fa-solid fa-language"></i> Cột B: Nghĩa Tiếng Việt
              </div>
              <div id="matching-col-vi-cards" style="display:flex; flex-direction:column; gap:12px;"></div>
            </div>
          </div>

          <div id="matching-feedback" style="text-align:center; min-height:42px; margin-bottom:16px;"></div>

          <div id="matching-actions" style="text-align:center; display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">
            <button onclick="renderMatchingMode(document.getElementById('vocab-workspace'), ${safeBatchIndex})" class="practice-btn practice-btn-neutral">
              <i class="fa-solid fa-rotate-left"></i> Trộn Lại Hiệp Này
            </button>
            ${totalWords > batchSize ? `
            <button onclick="renderMatchingMode(document.getElementById('vocab-workspace'), ${(safeBatchIndex + 1)})" class="practice-btn practice-btn-primary">
              <i class="fa-solid fa-forward-step"></i> Hiệp Tiếp Theo
            </button>
            ` : ''}
          </div>
        </div>
      `;

      updateMatchingGridCards();
    }

    function updateMatchingGridCards() {
      const zhCol = document.getElementById('matching-col-zh-cards');
      const viCol = document.getElementById('matching-col-vi-cards');
      if (!zhCol || !viCol || !matchingState) return;

      // 1. Render Cột A (Chữ Hán)
      let zhHtml = '';
      // A1. Các thẻ đã nối đúng (xếp lên các hàng đầu tiên)
      matchingState.matchedList.forEach(w => {
        zhHtml += `
          <div class="matching-card matched" id="match-zh-${w.id}">
            <span class="hanzi-text-main">${w.word}</span>
            <span class="matched-check-badge" title="Đã ghép đúng"><i class="fa-solid fa-check"></i></span>
          </div>
        `;
      });
      // A2. Các thẻ chưa nối
      matchingState.unmatchedZh.forEach(w => {
        const isSelected = matchingState.selectedZh && (matchingState.selectedZh.id === w.id);
        zhHtml += `
          <div class="matching-card ${isSelected ? 'selected' : ''}" 
               id="match-zh-${w.id}" 
               onclick="handleMatchSelect('zh', '${escapeMatchStr(w.word)}', ${w.id})">
            <span class="hanzi-text-main">${w.word}</span>
          </div>
        `;
      });
      zhCol.innerHTML = zhHtml;

      // 2. Render Cột B (Nghĩa Tiếng Việt)
      let viHtml = '';
      // B1. Các thẻ đã nối đúng (THEO ĐÚNG THỨ TỰ TƯƠNG ỨNG VỚI CỘT A ĐỂ XẾP CÙNG HÀNG)
      matchingState.matchedList.forEach(w => {
        viHtml += `
          <div class="matching-card matched" id="match-vi-${w.id}">
            <span class="matched-check-badge" title="Đã ghép đúng"><i class="fa-solid fa-check"></i></span>
            <span class="match-meaning-main">${w.meaning}</span>
          </div>
        `;
      });
      // B2. Các thẻ chưa nối
      matchingState.unmatchedVi.forEach(w => {
        const isSelected = matchingState.selectedVi && (matchingState.selectedVi.id === w.id);
        viHtml += `
          <div class="matching-card ${isSelected ? 'selected' : ''}" 
               id="match-vi-${w.id}" 
               onclick="handleMatchSelect('vi', '${escapeMatchStr(w.word)}', ${w.id})">
            <span class="match-meaning-main">${w.meaning}</span>
          </div>
        `;
      });
      viCol.innerHTML = viHtml;
    }

    function handleMatchSelect(type, word, id) {
      if (!matchingState) return;

      if (type === 'zh') {
        if (matchingState.selectedZh && matchingState.selectedZh.id === id) {
          matchingState.selectedZh = null;
          updateMatchingGridCards();
          return;
        }
        matchingState.selectedZh = { word, id };
        speakWord(word);
      } else if (type === 'vi') {
        if (matchingState.selectedVi && matchingState.selectedVi.id === id) {
          matchingState.selectedVi = null;
          updateMatchingGridCards();
          return;
        }
        matchingState.selectedVi = { word, id };
      }

      updateMatchingGridCards();

      // Khi đã chọn cả 2 bên (Chữ Hán & Nghĩa Tiếng Việt)
      if (matchingState.selectedZh && matchingState.selectedVi) {
        const zh = matchingState.selectedZh;
        const vi = matchingState.selectedVi;
        const feed = document.getElementById('matching-feedback');

        if (zh.word === vi.word) {
          // Ghép đúng!
          recordVocabResult(zh.word, true);

          const matchedWordObj = matchingState.batchWords.find(w => w.id === zh.id || w.word === zh.word);
          const pairData = matchedWordObj || { id: zh.id, word: zh.word, meaning: vi.word };

          // Thêm vào danh sách matchedList -> tự động xếp lên cùng một hàng ở trên
          matchingState.matchedList.push(pairData);

          // Loại bỏ khỏi danh sách chưa ghép
          matchingState.unmatchedZh = matchingState.unmatchedZh.filter(w => w.id !== zh.id && w.word !== zh.word);
          matchingState.unmatchedVi = matchingState.unmatchedVi.filter(w => w.id !== vi.id && w.word !== vi.word);

          matchingState.selectedZh = null;
          matchingState.selectedVi = null;

          if (feed) {
            feed.innerHTML = `<span style="color:#16a34a; font-weight:800; font-size:1.05rem;"><i class="fa-solid fa-circle-check"></i> Ghép đúng: <strong>${zh.word}</strong> = <em>${pairData.meaning}</em></span>`;
          }

          // Cập nhật lại giao diện: 2 từ vừa nối đúng lập tức xếp lên cùng một hàng!
          updateMatchingGridCards();

          // Kiểm tra nếu đã hoàn thành toàn bộ hiệp
          if (matchingState.matchedList.length >= matchingState.batchWords.length) {
            if (feed) {
              feed.innerHTML = `
                <div style="background:linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(2, 132, 199, 0.18)); border:2px solid #10b981; border-radius:14px; padding:14px 18px; margin-top:10px;">
                  <div style="font-size:1.15rem; font-weight:800; color:#16a34a; margin-bottom:4px;">
                    🎉 Xuất sắc! Bạn đã nối đúng toàn bộ ${matchingState.batchWords.length} từ!
                  </div>
                  <div style="font-size:0.88rem; color:var(--text-secondary, #cbd5e1);">
                    Tất cả các cặp từ đã được xếp thành từng hàng hoàn chỉnh.
                  </div>
                </div>
              `;
            }
          }
        } else {
          // Ghép sai
          recordVocabResult(zh.word, false);

          const zhEl = document.getElementById(`match-zh-${zh.id}`);
          const viEl = document.getElementById(`match-vi-${vi.id}`);
          if (zhEl) zhEl.classList.add('wrong');
          if (viEl) viEl.classList.add('wrong');

          if (feed) {
            feed.innerHTML = `<span style="color:#dc2626; font-weight:800; font-size:1rem;"><i class="fa-solid fa-circle-xmark"></i> Chưa chính xác, hãy ghép lại nhé!</span>`;
          }

          setTimeout(() => {
            matchingState.selectedZh = null;
            matchingState.selectedVi = null;
            updateMatchingGridCards();
          }, 450);
        }
      }
    }

    // 3. SẮP XẾP CÂU (SENTENCE UNSCRAMBLE)
    function renderUnscrambleMode(box) {
      const curWord = currentLessonWords[currentWordIndex % currentLessonWords.length];
      
      // Candidate sentence containing curWord
      let targetSentence = curWord.example_zh || `我想学${curWord.word}。`;
      let meaningVi = curWord.example_vi || `Tôi muốn học ${curWord.meaning}.`;

      // Split into chips
      const chips = targetSentence.replace(/[。！？]/g, '').split('').filter(c => c.trim().length > 0);
      const shuffledChips = chips.map((c, idx) => ({ char: c, id: idx, used: false })).sort(() => Math.random() - 0.5);

      window.activeUnscramble = {
        target: targetSentence.replace(/[。！？]/g, ''),
        assembled: [],
        chips: shuffledChips
      };

      box.innerHTML = `
        <div style="max-width:720px; margin:0 auto; text-align:center;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <span style="font-weight:800; font-size:0.95rem; color:#38bdf8;">
              <i class="fa-solid fa-arrow-down-a-z"></i> Câu ${currentWordIndex + 1} / ${currentLessonWords.length}
            </span>
            <span style="font-weight:800; font-size:0.9rem; color:#fbbf24;">
              Dạng 3: Sắp Xếp Câu
            </span>
          </div>

          <!-- Prompt Box Dịu Mắt -->
          <div class="practice-prompt-card">
            <div class="prompt-title" style="font-size:0.9rem; font-weight:800; color:#38bdf8; text-transform:uppercase; margin-bottom:6px;">
              <i class="fa-solid fa-flag"></i> Nghĩa tiếng Việt gợi ý:
            </div>
            <div class="prompt-main-text" style="font-size:1.35rem; font-weight:800; color:#ffffff;">
              "${meaningVi}"
            </div>
            <div class="prompt-sub-text" style="margin-top:10px; font-size:0.85rem; color:#94a3b8;">
              Từ vựng trọng tâm: <strong style="color:#d97706;">${curWord.word}</strong> (${curWord.pinyin})
            </div>
          </div>

          <!-- Assembled Sentence Drop Zone -->
          <div class="practice-label-green">
            Hàng ghép câu của bạn (Bấm vào từ để gỡ ra):
          </div>
          <div class="unscramble-container" id="unscramble-dropzone"></div>

          <!-- Available Chips -->
          <div class="practice-label-amber">
            Ngân hàng mảnh từ (Bấm để đưa lên hàng ghép):
          </div>
          <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:24px;" id="unscramble-bank">
            ${shuffledChips.map(c => `
              <div class="word-chip hanzi-text" id="chip-${c.id}" onclick="handleChipClick(${c.id})">
                ${c.char}
              </div>
            `).join('')}
          </div>

          <div id="unscramble-feedback" style="min-height:32px; margin-bottom:18px; font-weight:800; font-size:1.05rem;"></div>

          <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
            <button onclick="checkUnscrambleAnswer()" class="practice-btn practice-btn-success">
              <i class="fa-solid fa-check"></i> Kiểm Tra
            </button>
            <button onclick="renderUnscrambleMode(document.getElementById('vocab-workspace'))" class="practice-btn practice-btn-neutral">
              <i class="fa-solid fa-rotate-left"></i> Làm Lại
            </button>
            <button onclick="navWord(1)" class="practice-btn practice-btn-primary">
              Câu Tiếp Theo &rarr;
            </button>
          </div>
        </div>
      `;
    }

    function handleChipClick(chipId) {
      const state = window.activeUnscramble;
      if (!state) return;
      const chip = state.chips.find(c => c.id === chipId);
      if (!chip || chip.used) return;

      chip.used = true;
      state.assembled.push(chip);
      updateUnscrambleUI();
    }

    function removeAssembledChip(chipId) {
      const state = window.activeUnscramble;
      if (!state) return;
      const idx = state.assembled.findIndex(c => c.id === chipId);
      if (idx !== -1) {
        const removed = state.assembled.splice(idx, 1)[0];
        removed.used = false;
        updateUnscrambleUI();
      }
    }

    function updateUnscrambleUI() {
      const state = window.activeUnscramble;
      const dropzone = document.getElementById('unscramble-dropzone');
      if (dropzone) {
        dropzone.innerHTML = state.assembled.map(c => `
          <div class="assembled-word-chip hanzi-text" onclick="removeAssembledChip(${c.id})" title="Bấm để gỡ ra">
            ${c.char}
          </div>
        `).join('');
      }

      state.chips.forEach(c => {
        const el = document.getElementById(`chip-${c.id}`);
        if (el) {
          if (c.used) el.classList.add('used');
          else el.classList.remove('used');
        }
      });
    }

    function checkUnscrambleAnswer() {
      const state = window.activeUnscramble;
      const feed = document.getElementById('unscramble-feedback');
      if (!state || !feed) return;

      const curWord = currentLessonWords[currentWordIndex % currentLessonWords.length];
      const userSentence = state.assembled.map(c => c.char).join('');
      if (userSentence === state.target) {
        if (curWord) recordVocabResult(curWord, true);
        feed.innerHTML = `<div class="feedback-badge feedback-badge-success"><i class="fa-solid fa-circle-check"></i> Xuất sắc! Câu ghép hoàn toàn chính xác!</div>`;
        speakWord(state.target);
      } else {
        if (curWord) recordVocabResult(curWord, false);
        feed.innerHTML = `<div class="feedback-badge feedback-badge-error"><i class="fa-solid fa-circle-xmark"></i> Thứ tự chưa đúng, thử sắp xếp lại nhé!</div>`;
      }
    }

    // 4. ĐIỀN TỪ VÀO CÂU (SENTENCE CLOZE)
    function renderSentenceClozeMode(box) {
      const curWord = currentLessonWords[currentWordIndex % currentLessonWords.length];
      const otherWords = currentLessonWords.filter(w => w.word !== curWord.word).sort(() => Math.random() - 0.5).slice(0, 3);
      const options = [curWord, ...otherWords].sort(() => Math.random() - 0.5);

      const sentenceFull = curWord.example_zh || `今天的天气很${curWord.word}。`;
      const clozeSentence = sentenceFull.includes(curWord.word)
        ? sentenceFull.replace(curWord.word, `<span id="cloze-slot-display" style="display:inline-block; min-width:80px; border-bottom:3px solid #fbbf24; color:#fbbf24; font-weight:800; text-align:center;">______</span>`)
        : `我喜欢 <span id="cloze-slot-display" style="display:inline-block; min-width:80px; border-bottom:3px solid #fbbf24; color:#fbbf24; font-weight:800; text-align:center;">______</span>。`;

      box.innerHTML = `
        <div style="max-width:720px; margin:0 auto; text-align:center;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <span style="font-weight:800; font-size:0.95rem; color:#38bdf8;">
              <i class="fa-solid fa-pen-nib"></i> Câu ${currentWordIndex + 1} / ${currentLessonWords.length}
            </span>
            <span style="font-weight:800; font-size:0.9rem; color:#fbbf24;">
              Dạng 4: Điền Từ Vào Câu
            </span>
          </div>

          <!-- Sentence Card Dịu Mắt -->
          <div class="practice-prompt-card">
            <div class="prompt-title" style="font-size:0.9rem; font-weight:800; color:#38bdf8; text-transform:uppercase; margin-bottom:12px;">
              Chọn từ thích hợp nhất để hoàn thành câu:
            </div>
            <div class="hanzi-text prompt-main-text" style="font-size:1.55rem; font-weight:800; color:#ffffff; line-height:1.8; margin-bottom:12px;">
              ${clozeSentence}
            </div>
            ${curWord.example_vi ? `<div class="prompt-sub-text" style="font-size:0.95rem; color:#cbd5e1; font-style:italic;">Dịch: "${curWord.example_vi}"</div>` : ''}
          </div>

          <!-- Options Grid -->
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px;">
            ${options.map((opt, idx) => `
              <button class="ans-opt-btn hanzi-text" onclick="checkSentenceClozeAnswer('${opt.word}', '${curWord.word}', this)" style="padding:16px 20px; border-radius:14px; font-size:1.25rem; font-weight:800; cursor:pointer; text-align:center;">
                <div>${opt.word}</div>
                <div style="font-size:0.85rem; color:#64748b; font-weight:600; font-family:var(--font-main);">${opt.pinyin} - ${opt.meaning}</div>
              </button>
            `).join('')}
          </div>

          <div id="cloze-feedback" style="min-height:32px; margin-bottom:18px; font-weight:800; font-size:1.05rem;"></div>

          <div style="display:flex; justify-content:space-between; gap:12px;">
            <button onclick="navWord(-1)" class="practice-btn practice-btn-neutral">
              &larr; Câu trước
            </button>
            <button onclick="navWord(1)" class="practice-btn practice-btn-primary">
              Câu tiếp theo &rarr;
            </button>
          </div>
        </div>
      `;
    }

    function checkSentenceClozeAnswer(selectedWord, correctWord, btnEl) {
      const feed = document.getElementById('cloze-feedback');
      const slotEl = document.getElementById('cloze-slot-display');

      if (selectedWord === correctWord) {
        recordVocabResult(correctWord, true);
        btnEl.style.background = 'rgba(16, 185, 129, 0.2)';
        btnEl.style.borderColor = '#10b981';
        btnEl.style.color = '#10b981';
        if (slotEl) { slotEl.textContent = correctWord; slotEl.style.color = '#10b981'; }
        if (feed) feed.innerHTML = `<div class="feedback-badge feedback-badge-success"><i class="fa-solid fa-circle-check"></i> Chính xác! (${correctWord})</div>`;
        speakWord(correctWord);
      } else {
        recordVocabResult(correctWord, false);
        btnEl.style.background = 'rgba(239, 68, 68, 0.2)';
        btnEl.style.borderColor = '#ef4444';
        btnEl.style.color = '#ef4444';
        if (feed) feed.innerHTML = `<div class="feedback-badge feedback-badge-error"><i class="fa-solid fa-circle-xmark"></i> Chưa phù hợp ngữ cảnh, hãy thử lại!</div>`;
      }
    }

    // 5. ĐẶT CÂU CÙNG AI & VISUAL VOCABULARY
    function renderSentenceAiMode(box) {

              <i class="fa-solid fa-wand-magic-sparkles"></i> Từ ${currentWordIndex + 1} / ${currentLessonWords.length}
            </span>
            <span style="font-weight:800; font-size:0.9rem; color:#a78bfa;">
              Dạng 5: Đặt Câu Cùng AI
            </span>
          </div>

          <!-- Visual Vocabulary Flashcard Hero -->
          <div class="visual-vocab-card">
            <img src="${imgUrl}" alt="${curWord.word}" class="visual-word-img" onerror="this.src='/src/assets/logo.png'">
            
            <div class="hanzi-text" style="font-size:2.4rem; font-weight:900; color:#ffffff; margin-bottom:4px; display:flex; align-items:center; gap:12px;">
              <span>${curWord.word}</span>
              <button onclick="speakWord('${curWord.word}')" style="background:rgba(56,189,248,0.2); border:1px solid rgba(56,189,248,0.4); color:#38bdf8; width:40px; height:40px; border-radius:50%; cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center;">
                <i class="fa-solid fa-volume-high"></i>
              </button>
            </div>

            <div style="font-size:1.15rem; color:#fbbf24; font-weight:700; margin-bottom:6px;">
              [ ${curWord.pinyin || ''} ]
            </div>

            <div style="font-size:1.1rem; color:#cbd5e1; font-weight:600;">
              ${curWord.meaning} ${curWord.category ? `• <span style="color:#60a5fa;">${curWord.category}</span>` : ''}
            </div>
          </div>

          <!-- Input Sentence Box Dịu Mắt -->
          <div class="practice-prompt-card">
            <label class="prompt-title" style="font-size:0.95rem; font-weight:800; color:#cbd5e1; display:block; margin-bottom:10px;">
              Hãy đặt một câu tiếng Trung có chứa từ "<span style="color:#d97706;">${curWord.word}</span>":
            </label>
            <input type="text" id="ai-user-sentence-input" placeholder="Gõ câu tiếng Trung của bạn tại đây..." class="hanzi-text practice-ai-input" />

            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
              <div class="prompt-sub-text" style="font-size:0.85rem; color:#94a3b8;">
                Gõ bằng chữ Hán hoặc Pinyin
              </div>
              <button onclick="submitSentenceForAiCheck('${curWord.word}')" style="background:linear-gradient(135deg, #8b5cf6, #7c3aed); border:none; color:#ffffff; padding:12px 28px; border-radius:12px; font-weight:700; font-size:0.98rem; cursor:pointer; box-shadow:0 6px 20px rgba(139,92,246,0.3); display:inline-flex; align-items:center; gap:8px;">
                <i class="fa-solid fa-wand-magic-sparkles"></i> 🤖 AI Chấm Điểm & Phân Tích
              </button>
            </div>
          </div>

          <!-- AI Evaluation Result -->
          <div id="sentence-ai-result" style="display:none; margin-bottom:24px;"></div>

          <div style="display:flex; justify-content:space-between; gap:12px;">
            <button onclick="navWord(-1)" class="practice-btn practice-btn-neutral">
              &larr; Từ trước
            </button>
            <button onclick="navWord(1)" class="practice-btn practice-btn-primary">
              Từ tiếp theo &rarr;
            </button>
          </div>

          <div style="margin-top:20px; padding:12px 18px; border-radius:14px; background:linear-gradient(135deg, rgba(139,92,246,0.15), rgba(56,189,248,0.12)); border:1.5px solid rgba(168,85,247,0.35); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
            <div style="font-size:0.9rem; font-weight:700; color:var(--text-primary, #ffffff);">
              ✨ Bạn muốn AI chấm cả một <strong>bài văn dài</strong> hoặc luyện viết theo <strong>đề thi HSK</strong>?
            </div>
            <a href="/writing-practice.html" style="background:linear-gradient(135deg, #8b5cf6, #7c3aed); color:#ffffff; padding:6px 16px; border-radius:10px; font-weight:800; font-size:0.85rem; text-decoration:none; display:inline-flex; align-items:center; gap:6px;">

    async function submitSentenceForAiCheck(targetWord) {
      const inputEl = document.getElementById('ai-user-sentence-input');
      const resBox = document.getElementById('sentence-ai-result');
      if (!inputEl || !resBox) return;

      const sentence = inputEl.value.trim();
      if (!sentence || sentence.length < 2) {
        showToast('Vui lòng gõ câu của bạn trước nhé!', true);
        return;
      }

      resBox.style.display = 'block';
      resBox.innerHTML = `
        <div class="ai-result-card" style="text-align:center; padding:24px;">
          <i class="fa-solid fa-spinner fa-spin" style="font-size:2rem; color:#8b5cf6; margin-bottom:10px;"></i>
          <div style="font-weight:700;">AI HongTai đang kiểm tra ngữ pháp câu của bạn...</div>
        </div>
      `;

      try {
        const response = await fetch('/api/ai/check-sentence', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            word: targetWord,
            sentence: sentence,
            level: currentLevel
          })
        });

        if (response.ok) {
          const data = await response.json();
          renderSentenceCheckResult(data, resBox);
          return;
        }
        throw new Error('Check sentence failed');
      } catch (err) {
        const containsWord = targetWord ? sentence.includes(targetWord) : true;
        const isGibberish = /^([a-zA-Z0-9\u4e00-\u9fa5])\1{3,}$/.test(sentence) || sentence.length < 2;
        const ok = containsWord && !isGibberish;
        const charCount = (sentence.match(/[\u4e00-\u9fa5\u3400-\u4dbfa-zA-Z0-9]/g) || []).length;
        
        // Detect grammar
        const grammarPoints = [];
        if (/虽然|尽管/.test(sentence) && /但是|但|可是|却/.test(sentence)) grammarPoints.push('Mệnh đề nhượng bộ (虽然...但是...)');
        if (/因为/.test(sentence) && /所以/.test(sentence)) grammarPoints.push('Mệnh đề nhân quả (因为...所以...)');
        if (/不但|不仅/.test(sentence) && /而且|也|还/.test(sentence)) grammarPoints.push('Mệnh đề tăng tiến (不但...而且...)');
        if (/如果|要是/.test(sentence) && /就/.test(sentence)) grammarPoints.push('Mệnh đề giả thiết (如果...就...)');
        if (/把[\u4e00-\u9fa5]+/.test(sentence)) grammarPoints.push('Câu chữ 把');
        if (/被[\u4e00-\u9fa5]+/.test(sentence)) grammarPoints.push('Câu chữ 被');
        if (/比[\u4e00-\u9fa5]+/.test(sentence)) grammarPoints.push('Câu so sánh 比');
        if (/[\u4e00-\u9fa5]得(?:很|非常|十分|特别|真|极了|太)/.test(sentence)) grammarPoints.push('Bổ ngữ trạng thái (V + 得...)');
        if (/[\u4e00-\u9fa5](?:得懂|不懂|得见|不见|得完|不完|得了|不了)/.test(sentence)) grammarPoints.push('Bổ ngữ khả năng');
        if (/[\u4e00-\u9fa5](?:出来|进去|过来|过去|起来|下去)/.test(sentence)) grammarPoints.push('Bổ ngữ xu hướng kép');

        let score = 15;
        let badge = 'Chưa Đạt ❌';
        let feedback = `Câu chưa chứa từ vựng mục tiêu "${targetWord}". Hãy thử đặt lại câu có sử dụng từ này nhé!`;

        if (ok) {
          if (grammarPoints.length >= 2 && charCount >= 15) {
            score = 94;
            badge = 'Xuất Sắc 🏆';
            feedback = `Xuất sắc! Câu dài (${charCount} chữ), diễn đạt lưu loát và vận dụng nhiều cấu trúc ngữ pháp: ${grammarPoints.join(', ')}.`;
          } else if (grammarPoints.length >= 1 && charCount >= 12) {
            score = 83;
            badge = 'Rất Tốt 🌟';
            feedback = `Rất tốt! Câu có độ dài tốt (${charCount} chữ) và áp dụng cấu trúc ngữ pháp: ${grammarPoints.join(', ')}.`;
          } else if (charCount >= 8 && (grammarPoints.length >= 1 || charCount >= 10)) {
            score = 73;
            badge = 'Khá 👏';
            feedback = `Khá tốt! Câu rõ nghĩa, dùng từ "${targetWord}" chuẩn xác. Hãy thử dùng thêm liên từ câu phức để nâng cao điểm số!`;
          } else {
            score = 58;
            badge = 'Đạt (Cơ Bản) 👍';
            feedback = `Câu đúng ngữ pháp cơ bản và dùng đúng từ "${targetWord}", nhưng câu còn ngắn (${charCount} chữ) và đơn giản. Cần mở rộng câu và dùng thêm cấu trúc ngữ pháp để đạt điểm cao hơn!`;
          }
        }

        const fallback = {
          score,
          isCorrect: ok,
          badge,
          feedback,
          grammarPoints,
          grammarAnalysis: ok ? 'Cấu trúc câu cơ bản hoàn chỉnh.' : 'Chưa đạt yêu cầu.',
          improvedSentence: sentence,
          vietnameseTranslation: 'Bản dịch câu của bạn.'
        };
        renderSentenceCheckResult(fallback, resBox);
      }
    }

    function renderSentenceCheckResult(data, container) {
      const isCorrect = data.isCorrect !== false && (typeof data.score === 'number' ? data.score >= 50 : true);
      const score = typeof data.score === 'number' ? data.score : (isCorrect ? 58 : 20);
      const badge = data.badge || (
        score >= 90 ? 'Xuất Sắc 🏆' :
        score >= 80 ? 'Rất Tốt 🌟' :
        score >= 70 ? 'Khá 👏' :
        score >= 50 ? 'Đạt (Cơ Bản) 👍' : 'Chưa Đạt / Cần Sửa ❌'
      );
      const scoreColor = isCorrect && score >= 80 ? '#10b981' : (isCorrect && score >= 50 ? '#0284c7' : '#ef4444');
      const grammarPoints = Array.isArray(data.grammarPoints) ? data.grammarPoints : [];

      container.innerHTML = `
        <div class="ai-result-card" style="border: 1.5px solid ${scoreColor}40;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
            <div style="display:flex; align-items:center; gap:12px;">
              <span style="background:${scoreColor}; color:#fff; font-weight:900; font-size:1.1rem; padding:4px 14px; border-radius:99px;">
                ${score} / 100
              </span>
              <strong style="font-size:1.1rem;">Đánh Giá: <span style="color:${scoreColor};">${badge}</span></strong>
            </div>
            <button onclick="document.getElementById('sentence-ai-result').style.display='none'" class="practice-btn practice-btn-neutral" style="padding:4px 10px; font-size:0.85rem; border-radius:8px;">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          ${grammarPoints.length > 0 ? `
            <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:12px;">
              <span style="font-size:0.78rem; font-weight:800; color:#7c3aed; text-transform:uppercase;">Ngữ pháp nhận diện:</span>
              ${grammarPoints.map(p => `<span style="background:rgba(139, 92, 246, 0.12); color:#7c3aed; border:1px solid rgba(139, 92, 246, 0.28); border-radius:99px; padding:2px 10px; font-size:0.78rem; font-weight:700;"><i class="fa-solid fa-code-branch"></i> ${p}</span>`).join('')}
            </div>
          ` : ''}

          <div class="ai-result-feedback">
            <strong style="color:${isCorrect ? '#8b5cf6' : '#ef4444'};"><i class="fa-solid ${isCorrect ? 'fa-comment' : 'fa-triangle-exclamation'}"></i> Nhận xét AI:</strong> ${data.feedback || ''}
          </div>

          ${data.improvedSentence ? `
            <div class="ai-result-upgrade">
              <div style="font-size:0.85rem; font-weight:800; color:#0284c7; text-transform:uppercase; margin-bottom:4px;">
                <i class="fa-solid fa-sparkles"></i> ${isCorrect ? 'Câu gợi ý nâng cấp (Chuẩn Bản Xứ):' : 'Câu gợi ý mẫu chuẩn:'}
              </div>
              <div class="hanzi-text upgrade-text" style="font-size:1.2rem; font-weight:800;">
                ${data.improvedSentence}
              </div>
              ${data.vietnameseTranslation ? `<div style="font-size:0.88rem; color:#64748b; margin-top:4px;">Dịch: "${data.vietnameseTranslation}"</div>` : ''}
            </div>
          ` : ''}
        </div>
      `;
    }

    function navWord(dir) {
      currentWordIndex = (currentWordIndex + dir + currentLessonWords.length) % currentLessonWords.length;
      renderWorkspace();
    }

    function goToLessonStep(step) {
      if (step === 'vocab') {
        window.location.href = `/index.html?tab=lessons&level=${currentLevel}&version=${currentVersion}&openVocab=${currentLessonId}`;
      } else if (step === 'grammar') {
        window.location.href = `/hsk-grammar.html?level=${currentLevel}&lesson=${currentLessonId}&version=${currentVersion}`;
      } else if (step === 'text') {
        window.location.href = `/lesson-texts.html?lesson=${currentLessonId}&level=${currentLevel}&version=${currentVersion}`;
      } else if (step === 'quiz') {
        // Switch to Quiz Game
        window.location.href = `/quiz-game.html?lesson=${currentLessonId}&level=${currentLevel}&version=${currentVersion}`;
      }
    }

    function showToast(msg, isError = false) {
      let t = document.getElementById('vocab-toast');
      if (!t) {
        t = document.createElement('div');
        t.id = 'vocab-toast';
        t.style.cssText = 'position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background:rgba(15,23,42,0.95); color:#fff; padding:12px 24px; border-radius:99px; font-weight:700; font-size:0.95rem; box-shadow:0 10px 30px rgba(0,0,0,0.5); border:1.5px solid #38bdf8; z-index:999999; opacity:0; pointer-events:none; transition:all 0.3s;';
        document.body.appendChild(t);
      }
      t.innerHTML = msg;
      t.style.borderColor = isError ? '#ef4444' : '#38bdf8';
      t.style.opacity = '1';
      t.style.transform = 'translateX(-50%) translateY(0)';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => {
        t.style.opacity = '0';
        t.style.transform = 'translateX(-50%) translateY(100px)';
      }, 2500);
    }
  </script>
