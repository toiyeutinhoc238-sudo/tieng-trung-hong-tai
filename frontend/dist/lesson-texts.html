  <script>
    (function () {
      var t = localStorage.getItem('theme') || 'dark';
      var bgUrl = t === 'light' ? "url('/assets/app_bg_day_v3.png')" : "url('/assets/app_bg_night_v3.png')";
      document.documentElement.style.setProperty('background-image', bgUrl, 'important');
      document.documentElement.style.setProperty('background-size', 'cover', 'important');
      document.documentElement.style.setProperty('background-position', 'center center', 'important');
      document.documentElement.style.setProperty('background-attachment', 'fixed', 'important');
      document.documentElement.style.setProperty('background-repeat', 'no-repeat', 'important');

      if (t === 'light') {
        document.documentElement.classList.add('light-mode', 'light');
        document.documentElement.classList.remove('dark');
        if (document.body) {
          document.body.classList.add('light-mode');
          document.body.style.setProperty('background-image', bgUrl, 'important');
        } else {
          document.addEventListener('DOMContentLoaded', function () {
            document.body.classList.add('light-mode');
            document.body.style.setProperty('background-image', bgUrl, 'important');
          });
        }
      } else {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light', 'light-mode');
        if (document.body) {
          document.body.style.setProperty('background-image', bgUrl, 'important');
        } else {
          document.addEventListener('DOMContentLoaded', function () {
            document.body.style.setProperty('background-image', bgUrl, 'important');
          });
        }
      }
    })();

    window.toggleTheme = function () {
      var isLight = document.documentElement.classList.contains('light-mode') || document.documentElement.classList.contains('light');
      var nextDark = isLight;
      var bgUrl = nextDark ? "url('/assets/app_bg_night_v3.png')" : "url('/assets/app_bg_day_v3.png')";

      document.documentElement.style.setProperty('background-image', bgUrl, 'important');
      document.documentElement.style.setProperty('background-size', 'cover', 'important');
      document.documentElement.style.setProperty('background-position', 'center center', 'important');
      document.documentElement.style.setProperty('background-attachment', 'fixed', 'important');
      document.documentElement.style.setProperty('background-repeat', 'no-repeat', 'important');

      if (document.body) {
        document.body.style.setProperty('background-image', bgUrl, 'important');
        document.body.style.setProperty('background-size', 'cover', 'important');
        document.body.style.setProperty('background-position', 'center center', 'important');
        document.body.style.setProperty('background-attachment', 'fixed', 'important');
        document.body.style.setProperty('background-repeat', 'no-repeat', 'important');
      }

      if (nextDark) {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light', 'light-mode');
        if (document.body) {
          document.body.classList.remove('light-mode', 'light');
          document.body.classList.add('dark');
        }
        localStorage.setItem('theme', 'dark');
        updateToggleBtns(false);
      } else {
        document.documentElement.classList.add('light', 'light-mode');
        document.documentElement.classList.remove('dark');
        if (document.body) {
          document.body.classList.remove('dark');
          document.body.classList.add('light-mode');
        }
        localStorage.setItem('theme', 'light');
        updateToggleBtns(true);
      }
    };

    function updateToggleBtns(isLight) {
      var btns = document.querySelectorAll('#theme-toggle, #theme-toggle-btn, .theme-toggle-btn');
      btns.forEach(function (btn) {
        btn.innerHTML = isLight
          ? '<i class="fa-solid fa-sun" style="color:#f59e0b;"></i>'
          : '<i class="fa-solid fa-moon" style="color:#60a5fa;"></i>';
      });
    }
  </script>

    <!-- Controls Bar & Unified 4-Step Stepper -->
    <div class="lesson-stepper-hub-bar"
      style="background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 18px; padding: 10px 16px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; box-shadow: 0 10px 30px rgba(0,0,0,0.35);">
      <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
        <a id="stepper-roadmap-btn" href="/index.html?tab=lessons&level=1" class="btn-close"
          style="padding: 8px 14px; border-radius: 12px; font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; text-decoration: none;">
          <i class="fa-solid fa-map-location-dot"></i> Lộ trình
        </a>
        <div style="font-weight: 800; font-size: 1.05rem; color: #fbbf24; display: flex; align-items: center; gap: 8px;"
          id="lesson-title-badge">
          <i class="fa-solid fa-bookmark" style="color: #38bdf8;"></i> Bài Khóa HSK 1 - Bài 1
        </div>
        <button id="pinyin-toggle-hub-btn" class="btn-close" onclick="window.togglePinyinVisibility()"
          title="Bật/Tắt hiển thị Pinyin trong Bài Khóa" style="padding: 6px 12px; border-radius: 10px; font-weight: 700; font-size: 0.82rem; background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.35); color: #fbbf24; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
          <i class="fa-solid fa-eye" id="pinyin-hub-icon"></i>
          <span id="pinyin-hub-label">Pinyin: BẬT</span>
        </button>
      </div>

      <!-- 4 Step Tabs -->
      <div class="lesson-stepper-tabs" style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button onclick="goToLessonStep('vocab')" class="stepper-tab-btn"
          style="padding: 8px 14px; border-radius: 12px; font-weight: 700; font-size: 0.88rem; cursor: pointer; border: 1.5px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); color: #cbd5e1; display: flex; align-items: center; gap: 6px; transition: all 0.2s;"
          title="Bước 1: Học từ vựng Flashcard">
          <i class="fa-solid fa-book-bookmark"></i> 1. Từ Vựng
        </button>
        <button onclick="goToLessonStep('grammar')" class="stepper-tab-btn"
          style="padding: 8px 14px; border-radius: 12px; font-weight: 700; font-size: 0.88rem; cursor: pointer; border: 1.5px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); color: #cbd5e1; display: flex; align-items: center; gap: 6px; transition: all 0.2s;"
          title="Bước 2: Học cấu trúc ngữ pháp">
          <i class="fa-solid fa-spell-check"></i> 2. Ngữ Pháp
        </button>
        <button class="stepper-tab-btn active"
          style="padding: 8px 14px; border-radius: 12px; font-weight: 700; font-size: 0.88rem; cursor: pointer; border: 1.5px solid #a78bfa; background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #ffffff; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 16px rgba(139,92,246,0.45);"
          title="Bước 3: Luyện đọc & nghe bài khóa (Đang ở đây)">
          <i class="fa-solid fa-comments"></i> 3. Bài Khóa
        </button>
        <button onclick="goToLessonStep('quiz')" class="stepper-tab-btn"
          style="padding: 8px 14px; border-radius: 12px; font-weight: 700; font-size: 0.88rem; cursor: pointer; border: 1.5px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); color: #cbd5e1; display: flex; align-items: center; gap: 6px; transition: all 0.2s;"
          title="Bước 4: Làm bài tập ôn tập trắc nghiệm">
          <i class="fa-solid fa-circle-play"></i> 4. Ôn Tập
        </button>
      </div>
    </div>

    <!-- Dialogue Selection Tabs (3 Bài Khóa) -->
    <div class="dialogue-tabs-container" id="dialogue-tabs-box">
      <button class="dialogue-tab-btn active" onclick="selectDialogue(1)">
        <i class="fa-solid fa-book-open"></i> Bài Khóa 1
      </button>
      <button class="dialogue-tab-btn" onclick="selectDialogue(2)">
        <i class="fa-solid fa-book-open"></i> Bài Khóa 2
      </button>
      <button class="dialogue-tab-btn" onclick="selectDialogue(3)">
        <i class="fa-solid fa-book-open"></i> Bài Khóa 3
      </button>
    </div>

    <!-- Mode Step Navigation Tabs (1, 2, 3, 4) -->
    <div class="mode-steps-container">
      <button id="step-btn-quiz" class="mode-step-btn" onclick="switchBkMode('quiz')">
        <i class="fa-solid fa-circle-question"></i> 1. Nghe chọn đáp án
      </button>
      <button id="step-btn-dictation" class="mode-step-btn active" onclick="switchBkMode('dictation')">
        <i class="fa-solid fa-headphones"></i> 2. Nghe nhập bài khóa
      </button>
      <button id="step-btn-translate" class="mode-step-btn" onclick="switchBkMode('translate')">
        <i class="fa-solid fa-language"></i> 3. Luyện dịch bài khóa
      </button>
      <button id="step-btn-read" class="mode-step-btn" onclick="switchBkMode('read')">
        <i class="fa-solid fa-book-open"></i> 4. Đọc Bài Khóa
      </button>
    </div>

    <!-- Dynamic Workspace Container -->
    <div class="workspace-box" id="workspace-content">
      <div style="text-align:center; padding:60px; color:#94a3b8;">
        <i class="fa-solid fa-spinner fa-spin" style="font-size:2rem; margin-bottom:12px; color:#38bdf8;"></i>
        <div>Đang tải nội dung Bài Khóa...</div>
      </div>
    </div>

  </div>

  <script>
    let allReadingTexts = [];
    let currentLevel = 1;
    let currentVersion = '3.0';
    let currentLessonId = 1;
    let currentDialogueId = 1; // 1 | 2 | 3
    let currentMode = 'quiz'; // 'quiz' (Step 1) | 'read' (Step 2) | 'dictation' (Step 3) | 'translate' (Step 4)
    let currentLineIndex = 0;
    let currentScore = 0;
    let completedChatLines = []; // Chat history for Dictation Mode

    document.addEventListener('DOMContentLoaded', async function () {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('lesson')) {
        currentLessonId = parseInt(urlParams.get('lesson'), 10) || 1;
      }
      if (urlParams.has('level')) {
        currentLevel = parseInt(urlParams.get('level'), 10) || 1;
      }
      if (urlParams.has('version')) {
        currentVersion = urlParams.get('version') || '3.0';
      } else {
        currentVersion = localStorage.getItem('active_hsk_version') || '3.0';
      }

      updateFixedBadges();
      await loadData();
      renderWorkspace();
    });

    async function loadData() {
      try {
        const file = `/hsk${currentLevel}_reading_texts.json`;
        const res = await fetch(file);
        if (res.ok) {
          allReadingTexts = await res.json();
        } else {
          const fallbackRes = await fetch('/hsk1_reading_texts.json');
          if (fallbackRes.ok) allReadingTexts = await fallbackRes.json();
        }
      } catch (e) {
        console.warn("Error loading reading texts:", e);
      }
    }

    function updateFixedBadges() {
      const lvlBadge = document.getElementById('fixed-level-badge');
      const lesBadge = document.getElementById('fixed-lesson-badge');
      const titleBadge = document.getElementById('lesson-title-badge');
      const headerRoadmapBtn = document.getElementById('header-roadmap-btn');
      const stepperRoadmapBtn = document.getElementById('stepper-roadmap-btn');

      if (lvlBadge) lvlBadge.textContent = `HSK ${currentLevel} (${currentVersion})`;
      if (lesBadge) lesBadge.textContent = `Bài ${currentLessonId}`;
      if (titleBadge) titleBadge.innerHTML = `<i class="fa-solid fa-bookmark"></i> Bài Khóa HSK ${currentLevel} (${currentVersion}) - Bài ${currentLessonId}`;
      if (headerRoadmapBtn) headerRoadmapBtn.href = `/index.html?tab=lessons&level=${currentLevel}&version=${currentVersion}`;
      if (stepperRoadmapBtn) stepperRoadmapBtn.href = `/index.html?tab=lessons&level=${currentLevel}&version=${currentVersion}`;
    }

    function selectDialogue(diagId) {
      currentDialogueId = diagId;
      currentLineIndex = 0;
      completedChatLines = [];

      // Update Dialogue Tab Buttons
      const tabBox = document.getElementById('dialogue-tabs-box');
      if (tabBox) {
        const btns = tabBox.querySelectorAll('.dialogue-tab-btn');
        btns.forEach((b, idx) => {
          if (idx + 1 === diagId) b.classList.add('active');
          else b.classList.remove('active');
        });
      }

      renderWorkspace();
    }

    function switchBkMode(mode) {
      currentMode = mode;
      currentLineIndex = 0;
      currentScore = 0;

      ['quiz', 'dictation', 'translate', 'read'].forEach(m => {
        const btn = document.getElementById(`step-btn-${m}`);
        if (btn) {
          if (m === currentMode) btn.classList.add('active');
          else btn.classList.remove('active');
        }
      });

      renderWorkspace();
    }

    function speakText(text) {
      if (!text) return;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN';
        u.rate = 0.88;
        window.speechSynthesis.speak(u);
      }
    }

    function playDialogueAudio(audioPath) {
      if (!audioPath) return;
      const audio = new Audio(audioPath);
      audio.play().catch(err => {
        console.warn("Audio file play error, falling back to TTS:", err);
      });
    }

    function getActiveDialogueData() {
      const lessonObj = (allReadingTexts || []).find(l => Number(l.lessonId) === currentLessonId);
      if (!lessonObj || !lessonObj.dialogues) return null;

      const diagObj = lessonObj.dialogues.find(d => Number(d.id) === currentDialogueId) || lessonObj.dialogues[0];
      return diagObj || null;
    }

    function renderWorkspace() {
      const box = document.getElementById('workspace-content');
      if (!box) return;

      const lessonObj = (allReadingTexts || []).find(l => Number(l.lessonId) === currentLessonId);

      // Render dynamic dialogue tabs
      const tabBox = document.getElementById('dialogue-tabs-box');
      if (tabBox && lessonObj && lessonObj.dialogues && lessonObj.dialogues.length > 0) {
        const numDialogues = lessonObj.dialogues.length;
        let tabHtml = '';
        for (let d = 1; d <= numDialogues; d++) {
          const isActive = d === currentDialogueId ? 'active' : '';
          tabHtml += `
            <button class="dialogue-tab-btn ${isActive}" onclick="selectDialogue(${d})">
              <i class="fa-solid fa-book-open"></i> Bài Khóa ${d}
            </button>
          `;
        }
        tabBox.innerHTML = tabHtml;
      }

      const diagObj = getActiveDialogueData();

      if (!diagObj) {
        box.innerHTML = `<div style="text-align:center; padding:60px; font-size:1.05rem; color:#94a3b8;">
          <i class="fa-solid fa-file-circle-exclamation" style="font-size:2.5rem; color:#fbbf24; margin-bottom:12px;"></i>
          <div>Nội dung Bài Khóa ${currentDialogueId} - Bài ${currentLessonId} đang được cập nhật!</div>
        </div>`;
        return;
      }

      const audioIdx = (currentDialogueId * 2) - 1;
      const audioUrl = diagObj.audio || `/audio/hsk${currentLevel}_texts/${currentLessonId}-${audioIdx}.mp3`;
      const lines = diagObj.lines || [];

      // Check if dialogue has valid quiz questions
      const quizObj = diagObj.quiz || {};
      const questions = (quizObj && quizObj.questions && quizObj.questions.length > 0) ? quizObj.questions : [];
      const hasValidQuiz = questions.length > 0;

      const quizTabBtn = document.getElementById('step-btn-quiz');
      if (quizTabBtn) {
        if (hasValidQuiz) {
          quizTabBtn.style.display = 'inline-flex';
        } else {
          quizTabBtn.style.display = 'none';
          if (currentMode === 'quiz') {
            currentMode = 'dictation';
            ['quiz', 'dictation', 'translate', 'read'].forEach(m => {
              const btn = document.getElementById(`step-btn-${m}`);
              if (btn) {
                if (m === currentMode) btn.classList.add('active');
                else btn.classList.remove('active');
              }
            });
          }
        }
      }

      // 1. QUIZ (1. Nghe chọn đáp án - Hỗ trợ cả Đúng/Sai và Trắc nghiệm)
      if (currentMode === 'quiz' && hasValidQuiz) {
        window.activeStep1Questions = questions;

        const isPassage = diagObj.isPassage || (currentDialogueId === 4);
        let qHtml = questions.map((q, qIdx) => {
          const isTf = q.type === 'true_false' || (q.options && q.options.length === 2 && q.options.includes('Đúng') && q.options.includes('Sai'));
          const typeBadge = isTf 
            ? `<span style="background:rgba(234,179,8,0.2); color:#facc15; padding:4px 12px; border-radius:99px; font-size:0.82rem; font-weight:700;"><i class="fa-solid fa-scale-balanced"></i> Phán đoán Đúng/Sai</span>`
            : `<span style="background:rgba(56,189,248,0.2); color:#38bdf8; padding:4px 12px; border-radius:99px; font-size:0.82rem; font-weight:700;"><i class="fa-solid fa-list-check"></i> Trắc nghiệm</span>`;

          const optsHtml = isTf ? `
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
              ${q.options.map((opt, oIdx) => {
                const isTrueOpt = opt.toLowerCase().includes('đúng');
                const icon = isTrueOpt ? 'fa-check' : 'fa-xmark';
                const baseColor = isTrueOpt ? '#10b981' : '#ef4444';
                return `
                  <button class="bk-quiz-opt-btn" onclick="checkStep1Answer(${qIdx}, ${oIdx}, this, 'quiz-feed-${qIdx}')" style="background:rgba(255,255,255,0.06); border:1.5px solid rgba(255,255,255,0.18); color:#f8fafc; padding:14px 18px; border-radius:12px; font-size:1.05rem; font-weight:700; cursor:pointer; text-align:center; transition:all 0.2s; display:flex; align-items:center; justify-content:center; gap:8px;">
                    <i class="fa-solid ${icon}" style="color:${baseColor};"></i>
                    <span>${opt}</span>
                  </button>
                `;
              }).join('')}
            </div>
          ` : `
            <div style="display:flex; flex-direction:column; gap:10px;">
              ${q.options.map((opt, oIdx) => `
                <button class="bk-quiz-opt-btn" onclick="checkStep1Answer(${qIdx}, ${oIdx}, this, 'quiz-feed-${qIdx}')" style="background:rgba(255,255,255,0.06); border:1.5px solid rgba(255,255,255,0.18); color:#f8fafc; padding:12px 18px; border-radius:12px; font-size:1rem; font-weight:600; cursor:pointer; text-align:left; transition:all 0.2s; display:flex; align-items:center; justify-content:space-between;">
                  <span>${String.fromCharCode(65 + oIdx)}. ${opt}</span>
                  <i class="fa-solid fa-check opt-icon" style="opacity:0;"></i>
                </button>
              `).join('')}
            </div>
          `;

          return `
            <div style="background:rgba(15,23,42,0.6); border:1px solid rgba(255,255,255,0.12); border-radius:18px; padding:22px; margin-bottom:18px; text-align:left;">
              <div style="font-size:1.08rem; font-weight:800; color:#ffffff; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
                <div style="display:flex; align-items:center; gap:10px;">
                  <span style="background:rgba(56,189,248,0.2); color:#38bdf8; padding:4px 12px; border-radius:99px; font-size:0.85rem; font-weight:800;">Câu ${qIdx + 1}</span>
                  <span>${q.question}</span>
                </div>
                ${typeBadge}
              </div>
              ${optsHtml}
              <div id="quiz-feed-${qIdx}" style="margin-top:10px; font-weight:700; font-size:0.95rem;"></div>
            </div>
          `;
        }).join('');

        box.innerHTML = `
          <div style="max-width:760px; margin:0 auto; text-align:center;">
            <h3 style="color:#f59e0b; font-size:1.3rem; margin-bottom:18px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:10px;">
              <i class="fa-solid fa-headphones"></i> BƯỚC 1: NGHE BÀI KHÓA & CHỌN ĐÁP ÁN ĐÚNG
            </h3>

            <!-- Audio Player Box -->
            <div style="background:linear-gradient(135deg, rgba(56,189,248,0.15), rgba(30,41,59,0.8)); border:1.5px solid rgba(56,189,248,0.35); border-radius:20px; padding:22px; margin-bottom:24px; box-shadow:0 8px 24px rgba(0,0,0,0.3);">
              <div style="font-size:0.95rem; color:#cbd5e1; margin-bottom:14px; font-weight:600;">
                <i class="fa-solid fa-circle-info" style="color:#38bdf8;"></i> ${isPassage ? 'Bấm nghe toàn bộ đoạn văn bài khóa, sau đó làm các bài tập phán đoán đúng sai & chọn đáp án đúng bên dưới:' : 'Bấm nghe toàn bộ Bài Khóa từ đầu tới cuối, sau đó chọn đáp án đúng cho các câu hỏi bên dưới:'}
              </div>

              <audio controls style="width:100%; max-width:500px; height:44px; outline:none; border-radius:12px;">
                <source src="${audioUrl}" type="audio/mpeg">
                Trình duyệt của bạn không hỗ trợ phát audio.
              </audio>
            </div>

            <!-- Questions Container -->
            ${qHtml}

            <div style="margin-top:24px;">
              <button onclick="switchBkMode('dictation')" style="background:linear-gradient(135deg, #10b981, #059669); border:none; color:#ffffff; padding:14px 32px; border-radius:14px; font-weight:800; font-size:1rem; cursor:pointer; box-shadow:0 6px 20px rgba(16,185,129,0.4); display:inline-flex; align-items:center; gap:10px;">
                Chuyển Sang Bước 2: Nghe Nhập Bài Khóa <i class="fa-solid fa-arrow-right"></i>
              </button>
            </div>
          </div>
        `;

        // 2. DICTATION (Nghe nhập bài khóa)
      } else if (currentMode === 'dictation') {
        if (lines.length === 0) {
          box.innerHTML = `<div style="text-align:center; padding:40px; color:#94a3b8;">Chưa có dữ liệu chính tả.</div>`;
          return;
        }

        const curLine = lines[currentLineIndex % lines.length];
        const hintChars = curLine.zh.match(/[\u4e00-\u9fa5]/g) || curLine.zh.split('');

        let chatHistoryHtml = completedChatLines.map((line, idx) => {
          const side = idx % 2 === 0 ? 'left' : 'right';
          return `
            <div class="chat-bubble ${side}">
              <div class="chat-speaker">${line.speaker || (side === 'left' ? 'Người A' : 'Người B')}</div>
              <div class="chat-zh hanzi-text">${line.zh}</div>
              ${line.pinyin ? `<div class="chat-py" data-role="pinyin">${line.pinyin}</div>` : ''}
              ${line.vi ? `<div class="chat-vi">${line.vi}</div>` : ''}
            </div>
          `;
        }).join('');

        if (completedChatLines.length === 0) {
          chatHistoryHtml = `
            <div style="text-align:center; padding:40px 20px; color:#94a3b8; font-size:0.9rem;">
              <i class="fa-solid fa-comments" style="font-size:2.5rem; color:#38bdf8; margin-bottom:10px; display:block; opacity:0.6;"></i>
              Gõ đúng từng câu ở khung bên phải để cuộc hội thoại hiển thị tại đây...
            </div>
          `;
        }

        box.innerHTML = `
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:24px;">
            
            <!-- LEFT COLUMN: Khung Đối Thoại Chat Frame -->
            <div style="background:rgba(15,23,42,0.75); border:1.5px solid rgba(56,189,248,0.3); border-radius:20px; padding:20px; display:flex; flex-direction:column; gap:14px; box-shadow:0 10px 30px rgba(0,0,0,0.3);">
              <div style="font-size:1.05rem; font-weight:800; color:#38bdf8; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px; display:flex; align-items:center; gap:8px;">
                <i class="fa-solid fa-comments"></i> KHUNG ĐỐI THOẠI BÀI KHÓA
              </div>
              <div class="chat-container" id="bk-chat-container">
                ${chatHistoryHtml}
              </div>
            </div>

            <!-- RIGHT COLUMN: Khung Luyện Gõ / Nghe Chính Tả -->
            <div style="background:rgba(30,41,59,0.7); border:1.5px solid rgba(255,255,255,0.15); border-radius:20px; padding:22px; display:flex; flex-direction:column; justify-content:space-between; box-shadow:0 10px 30px rgba(0,0,0,0.3);">
              <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                  <span style="font-size:0.9rem; font-weight:800; color:#f59e0b;"><i class="fa-solid fa-pen-to-square"></i> Câu ${currentLineIndex + 1} / ${lines.length}</span>
                  ${curLine.speaker ? `<span style="background:rgba(37,99,235,0.25); color:#60a5fa; border:1px solid rgba(59,130,246,0.35); padding:4px 12px; border-radius:10px; font-weight:700; font-size:0.82rem;">Nhân vật: ${curLine.speaker}</span>` : ''}
                </div>

                <div style="text-align:center; margin-bottom:20px;">
                  <button onclick="speakText(decodeURIComponent('${encodeURIComponent(curLine.zh)}'))" style="background:linear-gradient(135deg, #3b82f6, #1d4ed8); border:none; color:#ffffff; padding:12px 24px; border-radius:99px; font-weight:700; font-size:0.95rem; cursor:pointer; box-shadow:0 6px 20px rgba(59,130,246,0.4); display:inline-flex; align-items:center; gap:8px;">
                    <i class="fa-solid fa-volume-high"></i> BẤM ĐỂ NGHE CÂU THOẠI
                  </button>
                </div>

                <div style="background:rgba(15,23,42,0.6); border:1px solid rgba(255,255,255,0.12); border-radius:16px; padding:18px; margin-bottom:18px;">
                  <div style="font-size:0.88rem; font-weight:700; color:#38bdf8; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                    <span>Gõ lại câu bằng chữ Hán/Pinyin:</span>
                    <span id="dictation-feedback"></span>
                  </div>

                  <input type="text" id="dictation-input" placeholder="Gõ câu vừa nghe được..." oninput="checkDictationInput(decodeURIComponent('${encodeURIComponent(curLine.zh)}'))" class="hanzi-text" style="width:100%; padding:12px 16px; background:rgba(0,0,0,0.4); border:2px solid rgba(255,255,255,0.2); border-radius:12px; color:#ffffff; font-size:1.1rem; font-weight:600; outline:none; margin-bottom:14px; box-sizing:border-box;" />

                  <div id="dictation-hint-cards" style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:12px;">
                    ${hintChars.map(c => `

    function goToLessonStep(step) {
      if (step === 'vocab') {
        window.location.href = `/index.html?tab=lessons&level=${currentLevel}&version=${currentVersion}&openVocab=${currentLessonId}`;
      } else if (step === 'grammar') {
        window.location.href = `/hsk-grammar.html?level=${currentLevel}&lesson=${currentLessonId}&version=${currentVersion}`;
      } else if (step === 'text') {
        // Already on lesson texts page
      } else if (step === 'quiz') {
        window.location.href = `/quiz-game.html?lesson=${currentLessonId}&level=${currentLevel}&version=${currentVersion}`;
      }
    }
    window.goToLessonStep = goToLessonStep;

    function checkStep1Answer(qIdx, oIdx, btnEl, feedId) {
      const feed = document.getElementById(feedId);
      const questions = window.activeStep1Questions || [];
      const q = questions[qIdx];
      if (!q) return;

      const selected = q.options[oIdx] || '';
      const answer = q.answer || q.options[0] || '';

      const cleanSel = selected.replace(/[.,!?:;="'"()\[\]{}，。！？；：\s\-_~`]/g, '').toLowerCase();
      const cleanAns = answer.replace(/[.,!?:;="'"()\[\]{}，。！？；：\s\-_~`]/g, '').toLowerCase();

      if (cleanSel === cleanAns) {
        if (btnEl) {
          btnEl.style.background = 'rgba(16, 185, 129, 0.25)';
          btnEl.style.borderColor = '#10b981';
          btnEl.style.color = '#34d399';
        }
        if (feed) feed.innerHTML = `<span style="color:#10b981;"><i class="fa-solid fa-circle-check"></i> Chính xác!</span>`;
      } else {
        if (btnEl) {
          btnEl.style.background = 'rgba(239, 68, 68, 0.25)';
          btnEl.style.borderColor = '#ef4444';
          btnEl.style.color = '#f87171';
        }
        if (feed) feed.innerHTML = `<span style="color:#ef4444;"><i class="fa-solid fa-circle-xmark"></i> Chưa đúng! Đáp án đúng là: ${answer}</span>`;
      }
    }

    function checkDictationInput(target) {
      const inputEl = document.getElementById('dictation-input');
      const feedbackEl = document.getElementById('dictation-feedback');
      if (!inputEl || !feedbackEl) return;

      const typedRaw = inputEl.value.trim();
      const typed = typedRaw.replace(/[.,!?:;="'"()\[\]{}，。！？；：\s\-_~`]/g, '').toLowerCase();
      const cleanTarget = target.replace(/[.,!?:;="'"()\[\]{}，。！？；：\s\-_~`]/g, '').toLowerCase();

      updateLessonCharHintCards('dictation-hint-cards', typedRaw, target);

      if (typed === cleanTarget) {
        feedbackEl.innerHTML = `<span style="color:#10b981; font-weight:700;"><i class="fa-solid fa-circle-check"></i> Chính xác!</span>`;
        inputEl.style.borderColor = '#10b981';
        speakText(target);
      } else if (cleanTarget.startsWith(typed) && typed.length > 0) {
        feedbackEl.innerHTML = `<span style="color:#fbbf24; font-weight:600;"><i class="fa-solid fa-pen"></i> Đang gõ...</span>`;
        inputEl.style.borderColor = '#fbbf24';
      } else if (typed.length > 0) {
        feedbackEl.innerHTML = `<span style="color:#ef4444; font-weight:600;"><i class="fa-solid fa-circle-xmark"></i> Chưa đúng</span>`;
        inputEl.style.borderColor = '#ef4444';
      } else {
        feedbackEl.innerHTML = '';
        inputEl.style.borderColor = 'rgba(255,255,255,0.2)';
      }
    }

    function submitDictationLine() {
      const diagObj = getActiveDialogueData();
      if (!diagObj || !diagObj.lines) return;

      const lines = diagObj.lines;
      const curLine = lines[currentLineIndex % lines.length];

      // Add to completed chat lines
      if (!completedChatLines.includes(curLine)) {
        completedChatLines.push(curLine);
      }

      currentLineIndex = (currentLineIndex + 1) % lines.length;
      renderWorkspace();

      // Smooth scroll chat container to bottom
      setTimeout(() => {
        const chatBox = document.getElementById('bk-chat-container');
        if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
      }, 100);
    }

    function revealTranslationAnswer() {
      const feed = document.getElementById('translate-vi-feed');
      if (feed) feed.style.display = 'block';
    }

    function updateLessonCharHintCards(containerId, typedText, targetAnswer) {
      const container = typeof containerId === 'string' ? document.getElementById(containerId) : containerId;
      if (!container) return;

      const cards = container.querySelectorAll('.lesson-hint-card');
      if (cards.length === 0) return;

      const cleanTyped = (typedText || '').replace(/[.,!?:;="'"()\[\]{}，。！？；：\s\-_~`]/g, '');
      const cleanTarget = (targetAnswer || '').replace(/[.,!?:;="'"()\[\]{}，。！？；：\s\-_~`]/g, '');

      const typedChars = cleanTyped.match(/[\u4e00-\u9fa5]/g) || cleanTyped.split('');
      const targetChars = cleanTarget.match(/[\u4e00-\u9fa5]/g) || cleanTarget.split('');

      cards.forEach((card, idx) => {
        const targetChar = targetChars[idx] || card.getAttribute('data-char') || '';

        if (idx < typedChars.length) {
          const typedChar = typedChars[idx];
          if (typedChar === targetChar) {
            card.setAttribute('data-flipped', 'true');
            card.style.background = 'rgba(16, 185, 129, 0.25)';
            card.style.border = '2px solid #10b981';
            card.style.color = '#34d399';
            card.style.boxShadow = '0 0 16px rgba(16, 185, 129, 0.4)';
            card.innerHTML = `<span style="font-size: 1.3rem; font-weight: 800; font-family: var(--font-hanzi);">${targetChar}</span>`;
          } else {
            card.setAttribute('data-flipped', 'false');
            card.style.background = 'rgba(239, 68, 68, 0.25)';
            card.style.border = '2px solid #ef4444';
            card.style.color = '#f87171';
            card.style.boxShadow = '0 0 16px rgba(239, 68, 68, 0.4)';
            card.innerHTML = `<i class="fa-solid fa-eye" style="color: #f87171;"></i>`;
          }
        } else {
          const isManualFlipped = card.getAttribute('data-manual-flipped') === 'true';
          if (isManualFlipped) {
            card.style.background = '#ffffff';
            card.style.border = '1px solid rgba(255,255,255,0.2)';
            card.style.color = '#0f172a';
            card.style.boxShadow = '0 4px 12px rgba(0,0,0,0.3)';
            card.innerHTML = `<span style="font-size: 1.3rem; font-weight: 800; font-family: var(--font-hanzi);">${targetChar}</span>`;
          } else {
            card.setAttribute('data-flipped', 'false');
            card.style.background = 'rgba(255,255,255,0.08)';
            card.style.border = '1px solid rgba(255,255,255,0.2)';
            card.style.color = '#94a3b8';
            card.style.boxShadow = '0 4px 12px rgba(0,0,0,0.3)';
            card.innerHTML = `<i class="fa-solid fa-eye"></i>`;
          }
        }
      });
    }

    function toggleHint(btnEl, char) {
      if (!btnEl) return;
      const isFlipped = btnEl.getAttribute('data-manual-flipped') === 'true';
      if (isFlipped) {
        btnEl.setAttribute('data-manual-flipped', 'false');
        btnEl.style.background = 'rgba(255,255,255,0.08)';
        btnEl.style.color = '#94a3b8';
        btnEl.style.border = '1px solid rgba(255,255,255,0.2)';
        btnEl.innerHTML = `<i class="fa-solid fa-eye"></i>`;
      } else {
        btnEl.setAttribute('data-manual-flipped', 'true');
        btnEl.style.background = '#ffffff';
        btnEl.style.color = '#0f172a';
        btnEl.style.border = '1px solid rgba(255,255,255,0.2)';
        btnEl.innerHTML = `<span style="font-size: 1.3rem; font-weight: 800; font-family: var(--font-hanzi);">${char}</span>`;
      }
    }

    function revealAllHints(word) {
      const cards = document.querySelectorAll('.lesson-hint-card');
      if (cards.length === 0) return;
      const allFlipped = Array.from(cards).every(c => c.getAttribute('data-flipped') === 'true');
      const chars = word.match(/[\u4e00-\u9fa5]/g) || word.split('');

      cards.forEach((card, idx) => {
        if (allFlipped) {
          card.setAttribute('data-flipped', 'false');
          card.setAttribute('data-manual-flipped', 'false');
          card.style.background = 'rgba(255,255,255,0.08)';
          card.style.color = '#94a3b8';
          card.style.border = '1px solid rgba(255,255,255,0.2)';
          card.innerHTML = `<i class="fa-solid fa-eye"></i>`;
        } else {
          if (chars[idx]) {
            card.setAttribute('data-flipped', 'true');
            card.setAttribute('data-manual-flipped', 'true');
            card.style.background = '#ffffff';
            card.style.color = '#0f172a';
            card.style.border = '1px solid rgba(255,255,255,0.2)';
            card.innerHTML = `<span style="font-size: 1.3rem; font-weight: 800; font-family: var(--font-hanzi);">${chars[idx]}</span>`;
          }
        }
      });
    }

    function navLine(dir, total) {
      currentLineIndex = (currentLineIndex + dir + total) % total;
      renderWorkspace();
    }

    // Pinyin Visibility Management & Toast Notification
    let showPinyin = localStorage.getItem('lesson_text_show_pinyin') !== 'false';

    function initPinyinState() {
      const saved = localStorage.getItem('lesson_text_show_pinyin');
      showPinyin = saved !== 'false';
      applyPinyinState(false);
    }

    function applyPinyinState(showToastNotice = false) {
      if (showPinyin) {
        document.body.classList.remove('hide-pinyin');
        document.documentElement.classList.remove('hide-pinyin');
      } else {
        document.body.classList.add('hide-pinyin');
        document.documentElement.classList.add('hide-pinyin');
      }

      const iconEls = [document.getElementById('pinyin-toggle-icon'), document.getElementById('pinyin-hub-icon')];
      const labelEls = [document.getElementById('pinyin-toggle-label'), document.getElementById('pinyin-hub-label')];

      iconEls.forEach(el => {
        if (el) el.className = showPinyin ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
      });

      labelEls.forEach(el => {
        if (el) el.textContent = showPinyin ? 'Pinyin: BẬT' : 'Pinyin: TẮT';
      });

      if (showToastNotice) {
        showLessonToast(showPinyin ? '👁️ Đã BẬT hiển thị Pinyin bài khóa' : '🙈 Đã ẨN Pinyin bài khóa (tự thử thách khả năng đọc chữ Hán)');
      }
    }

    window.togglePinyinVisibility = function () {
      showPinyin = !showPinyin;
      localStorage.setItem('lesson_text_show_pinyin', showPinyin ? 'true' : 'false');
      applyPinyinState(true);
    };

    function showLessonToast(msg, isError = false) {
      let t = document.getElementById('lesson-toast');
      if (!t) {
        t = document.createElement('div');
        t.id = 'lesson-toast';
        t.style.cssText = 'position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(15, 23, 42, 0.95); color: #ffffff; padding: 12px 24px; border-radius: 99px; font-weight: 700; font-size: 0.95rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1.5px solid rgba(56, 189, 248, 0.6); z-index: 999999; opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); display: flex; align-items: center; gap: 10px; backdrop-filter: blur(16px);';
        document.body.appendChild(t);
      }
      t.innerHTML = msg;
      t.style.borderColor = isError ? 'rgba(239, 68, 68, 0.7)' : 'rgba(56, 189, 248, 0.7)';
      t.style.opacity = '1';
      t.style.transform = 'translateX(-50%) translateY(0)';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => {
        t.style.opacity = '0';
        t.style.transform = 'translateX(-50%) translateY(100px)';
      }, 2500);
    }
    window.showToast = showLessonToast;

    // Apply saved pinyin state on load
    document.addEventListener('DOMContentLoaded', () => {
      initPinyinState();
    });
  </script>
