  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => { });
      });
    }
    (function () {
      var t = localStorage.getItem('theme') || 'dark';
      var bgUrl = t === 'light' ? "url('/assets/app_bg_day_v3.png')" : "url('/assets/app_bg_night_v3.png')";
      document.documentElement.style.setProperty('background-image', bgUrl, 'important');
      document.documentElement.style.setProperty('background-size', 'cover', 'important');
      document.documentElement.style.setProperty('background-position', 'center center', 'important');
      document.documentElement.style.setProperty('background-attachment', 'fixed', 'important');
      document.documentElement.style.setProperty('background-repeat', 'no-repeat', 'important');

      if (t === 'light') {
        document.documentElement.classList.add('light-mode', 'light');
        document.documentElement.classList.remove('dark');
        if (document.body) {
          document.body.classList.add('light-mode');
          document.body.style.setProperty('background-image', bgUrl, 'important');
        } else {
          document.addEventListener('DOMContentLoaded', function () {
            document.body.classList.add('light-mode');
            document.body.style.setProperty('background-image', bgUrl, 'important');
          });
        }
      } else {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light', 'light-mode');
        if (document.body) {
          document.body.style.setProperty('background-image', bgUrl, 'important');
        } else {
          document.addEventListener('DOMContentLoaded', function () {
            document.body.style.setProperty('background-image', bgUrl, 'important');
          });
        }
      }
    })();

    window.toggleTheme = function () {
      var isLight = document.documentElement.classList.contains('light-mode') || document.documentElement.classList.contains('light');
      var nextDark = isLight;
      var bgUrl = nextDark ? "url('/assets/app_bg_night_v3.png')" : "url('/assets/app_bg_day_v3.png')";

      document.documentElement.style.setProperty('background-image', bgUrl, 'important');
      document.documentElement.style.setProperty('background-size', 'cover', 'important');
      document.documentElement.style.setProperty('background-position', 'center center', 'important');
      document.documentElement.style.setProperty('background-attachment', 'fixed', 'important');
      document.documentElement.style.setProperty('background-repeat', 'no-repeat', 'important');

      if (document.body) {
        document.body.style.setProperty('background-image', bgUrl, 'important');
        document.body.style.setProperty('background-size', 'cover', 'important');
        document.body.style.setProperty('background-position', 'center center', 'important');
        document.body.style.setProperty('background-attachment', 'fixed', 'important');
        document.body.style.setProperty('background-repeat', 'no-repeat', 'important');
      }

      if (nextDark) {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light', 'light-mode');
        if (document.body) {
          document.body.classList.remove('light', 'light-mode');
          document.body.classList.add('dark');
        }
        localStorage.setItem('theme', 'dark');
        updateToggleBtns(false);
      } else {
        document.documentElement.classList.add('light', 'light-mode');
        document.documentElement.classList.remove('dark');
        if (document.body) {
          document.body.classList.remove('dark');
          document.body.classList.add('light-mode');
        }
        localStorage.setItem('theme', 'light');
        updateToggleBtns(true);
      }
    };

    function updateToggleBtns(isLight) {
      var btns = document.querySelectorAll('#theme-toggle, #theme-toggle-btn, .theme-toggle-btn, .theme-toggle-btn-top');
      btns.forEach(function (btn) {
        if (btn.id === 'particle-toggle-btn' || btn.classList.contains('particle-toggle-btn')) return;
        btn.innerHTML = isLight
          ? '<i class="fa-solid fa-moon" style="color:#d97706;"></i>'
          : '<i class="fa-solid fa-sun" style="color:#f59e0b;"></i>';
      });
    }

    window.toggleSeasonalParticles = function() {
      var current = localStorage.getItem('particles_enabled') !== 'false';
      var next = !current;
      localStorage.setItem('particles_enabled', next ? 'true' : 'false');
      updateParticleToggleBtns(next);
      var cv = document.getElementById('seasonal-particle-canvas');
      if (cv) cv.style.display = next ? 'block' : 'none';
      if (typeof showToast === 'function') {
        showToast(next ? 'Đã BẬT hiệu ứng thời tiết mùa' : 'Đã TẮT hiệu ứng thời tiết mùa');
      }
    };

    function updateParticleToggleBtns(enabled) {
      var btns = document.querySelectorAll('#particle-toggle-btn, .particle-toggle-btn');
      btns.forEach(function(btn) {
        if (enabled) {
          btn.classList.remove('particles-off');
          btn.innerHTML = '<i class="fa-solid fa-snowflake" style="color: #60a5fa;"></i>';
          btn.title = 'Tắt hiệu ứng rơi động (Đang BẬT)';
        } else {
          btn.classList.add('particles-off');
          btn.innerHTML = '<i class="fa-solid fa-snowflake" style="opacity: 0.35; color: #94a3b8;"></i>';
          btn.title = 'Bật hiệu ứng rơi động (Đang TẮT)';
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      var isLight = document.documentElement.classList.contains('light-mode') || document.documentElement.classList.contains('light');
      updateToggleBtns(isLight);
      var enabled = localStorage.getItem('particles_enabled') !== 'false';
      updateParticleToggleBtns(enabled);
    });
  </script>

  <script>
    // --- STATE MANAGEMENT ---
    let vocabList = [];
    let filteredList = [];
    let currentUser = null;

    // Pagination parameters
    const pageSize = 50;
    let currentPage = 1;

    // Resolve dynamic API URL
    const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === ''
      ? 'http://localhost:5000'
      : 'https://tieng-trung-hong-tai.onrender.com';

    // Auth headers builder
    function getAuthHeaders(customHeaders = {}) {
      const token = localStorage.getItem('session_token');
      const headers = { ...customHeaders };
      if (token) {
        headers['Authorization'] = `Bearer ${token}`;
        headers['x-session-token'] = token;
      }
      return headers;
    }

    // Retrieve active logged in user from localStorage
    const savedUser = localStorage.getItem('user');
    if (savedUser) {
      try {
        currentUser = JSON.parse(savedUser);
      } catch (e) {
        localStorage.removeItem('user');
      }
    }

    // Parse URL query parameters to apply filters
    const urlParams = new URLSearchParams(window.location.search);
    let activeLevel = urlParams.get('level') || 'all';
    let activeStatus = urlParams.get('status') || 'all';
    let activeHskVersion = urlParams.get('hskVersion') || '3.0';
    const initialSearch = urlParams.get('search') || '';
    const customCategory = urlParams.get('customCategory') || '';

    // Document DOM load event listener
    document.addEventListener('DOMContentLoaded', () => {
      // Set initial search input value
      const searchInput = document.getElementById('detail-search-input');
      if (searchInput) {
        searchInput.value = initialSearch;
        searchInput.addEventListener('input', handleSearchInput);
      }

      // Initialize dropdown selections
      function syncDetailLevelSelectOptions() {
        const levelSelect = document.getElementById('detail-level-select');
        if (!levelSelect) return;
        const opt79 = levelSelect.querySelector('option[value="7-9"]');
        if (activeHskVersion === '2.0') {
          if (opt79) {
            window._detailOpt79 = opt79;
            opt79.remove();
          }
          if (activeLevel === '7-9') {
            activeLevel = 'all';
            levelSelect.value = 'all';
          }
        } else {
          if (!opt79) {
            if (!window._detailOpt79) {
              const opt = document.createElement('option');
              opt.value = '7-9';
              opt.textContent = 'Cấp độ: HSK 7-8-9 (Cao cấp)';
              window._detailOpt79 = opt;
            }
            levelSelect.appendChild(window._detailOpt79);
          }
        }
      }

      const versionSelect = document.getElementById('detail-version-select');
      if (versionSelect) {
        versionSelect.value = activeHskVersion;
        syncDetailLevelSelectOptions();
        versionSelect.addEventListener('change', (e) => {
          activeHskVersion = e.target.value;
          syncDetailLevelSelectOptions();
          applyFilters();
        });
      }

      const levelSelect = document.getElementById('detail-level-select');
      if (levelSelect) {
        levelSelect.value = activeLevel;
        levelSelect.addEventListener('change', (e) => {
          activeLevel = e.target.value;
          applyFilters();
        });
      }

      const statusSelect = document.getElementById('detail-status-select');
      if (statusSelect) {
        statusSelect.value = activeStatus;
        statusSelect.addEventListener('change', (e) => {
          activeStatus = e.target.value;
          applyFilters();
        });
      }

      // Update custom filters badges UI
      updateFiltersBadges();

      // Fetch vocabulary data
      fetchVocabulary();

      // Excel Export Button Handler
      const exportExcelBtn = document.getElementById('export-excel-btn');
      if (exportExcelBtn) {
        exportExcelBtn.addEventListener('click', exportToExcel);
      }
    });

    window.downloadHsk30Pdf = function() {
      const pdfMap = {
        '1': '/grammar-files/hsk 3.0 new chuan xac/HSK1.pdf',
        '2': '/grammar-files/hsk 3.0 new chuan xac/HSK2.pdf',
        '3': '/grammar-files/hsk 3.0 new chuan xac/HSK3.pdf',
        '4': '/grammar-files/hsk 3.0 new chuan xac/HSK4.pdf',
        '5': '/grammar-files/hsk 3.0 new chuan xac/HSK5.pdf',

    function updateFiltersBadges() {
      const customEl = document.getElementById('badge-custom');
      if (customEl) {
        if (customCategory) {
          customEl.textContent = `Sổ tay: ${customCategory}`;
          customEl.style.display = 'inline-block';
        } else {
          customEl.style.display = 'none';
        }
      }
    }

    function exportToExcel() {
      const wordsToExport = filteredList;
      if (wordsToExport.length === 0) {
        showToast('Không có từ vựng nào để xuất!', true);
        return;
      }

      // Prepend UTF-8 BOM \uFEFF so Excel reads Vietnamese/Chinese characters correctly.
      let csvContent = "Chữ Hán,Pinyin,Nghĩa tiếng Việt,Cấp độ,Học thuộc,Yêu thích\n";

      wordsToExport.forEach(w => {
        // Escape commas and quotes inside fields to prevent broken CSV columns
        const escapeCSV = (text) => {
          if (text === null || text === undefined) return '';
          let val = text.toString().replace(/"/g, '""'); // escape double quotes
          if (val.includes(',') || val.includes('\n') || val.includes('"')) {
            val = `"${val}"`; // wrap in quotes if commas/newlines/quotes exist
          }
          return val;
        };

        const word = escapeCSV(w.word);
        const pinyin = escapeCSV(w.pinyin);
        const meaning = escapeCSV(w.meaning);
        const level = escapeCSV(w.isCustom ? 'Cá nhân' : (w.level === 'premium' ? 'Premium' : 'HSK ' + w.level + ' (v' + (w.hskVersion || '3.0') + ')'));
        const memorized = escapeCSV(w.isMemorized ? 'Đã thuộc' : 'Chưa thuộc');
        const starred = escapeCSV(w.isStarred ? 'Yêu thích' : 'Không');

        csvContent += `${word},${pinyin},${meaning},${level},${memorized},${starred}\n`;
      });

      const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;

      let fileName = 'danh_sach_tu_vung';
      if (activeLevel !== 'all') fileName += `_hsk${activeLevel}`;
      fileName += `_v${activeHskVersion}`;
      if (activeStatus !== 'all') fileName += `_${activeStatus}`;
      fileName += '.csv';

      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Đã xuất danh sách thành công! 📊');
    }

    function cleanPinyinText(str) {
      if (!str) return '';
      const parts = str.split(/[|/\\;]/);
      let first = parts[0].trim();
      if (!first && parts.length > 1) {
        for (let i = 1; i < parts.length; i++) {
          if (parts[i].trim()) {
            first = parts[i].trim();
            break;
          }
        }
      }
      return first.replace(/\s+/g, ' ');
    }

    async function fetchVocabulary() {
      try {
        const response = await fetch(API_BASE_URL + '/api/vocabulary', {
          headers: getAuthHeaders(),
          credentials: 'include'
        });
        if (!response.ok) throw new Error('Không thể tải từ vựng');
        vocabList = await response.json();

        // Clean pinyin
        vocabList.forEach(w => {
          if (w.pinyin) {
            w.pinyin = cleanPinyinText(w.pinyin);
          }
        });

        // Load guest progress if not logged in
        if (!currentUser) {
          const guestProgress = JSON.parse(localStorage.getItem('guest_progress') || '{}');
          vocabList = vocabList.map(w => {
            const state = guestProgress[w.id];
            return {
              ...w,
              isMemorized: state ? !!state.isMemorized : !!w.isMemorized,
              isStarred: state ? !!state.isStarred : !!w.isStarred,
              isWrong: state ? !!state.isWrong : !!w.isWrong
            };
          });
        }

        applyFilters();
      } catch (err) {
        console.error('Fetch error:', err);
        showToast('Lỗi tải dữ liệu từ máy chủ. Đang thử dùng dữ liệu dự phòng...', true);

        // Clean pinyin in fallback as well
        vocabList.forEach(w => {
          if (w.pinyin) {
            w.pinyin = cleanPinyinText(w.pinyin);
          }
        });

        // Offline fallback guest sync
        if (!currentUser) {
          const guestProgress = JSON.parse(localStorage.getItem('guest_progress') || '{}');
          vocabList = vocabList.map(w => {
            const state = guestProgress[w.id];
            return {
              ...w,
              isMemorized: state ? !!state.isMemorized : !!w.isMemorized,
              isStarred: state ? !!state.isStarred : !!w.isStarred,
              isWrong: state ? !!state.isWrong : !!w.isWrong
            };
          });
        }
        applyFilters();
      }
    }

    function handleSearchInput(e) {
      applyFilters();
    }

    function matchLevel(wLevel, targetLevel) {
      if (!targetLevel || targetLevel === 'all') return true;
      if (!wLevel) return false;
      const w = wLevel.toString().trim().toLowerCase().replace('hsk', '');
      const t = targetLevel.toString().trim().toLowerCase().replace('hsk', '');
      if (w === t) return true;
      const hsk79 = ['7', '8', '9', '7-9', '7_9'];
      if (hsk79.includes(w) && hsk79.includes(t)) return true;
      return false;
    }

    function applyFilters() {
      const searchVal = document.getElementById('detail-search-input').value.toLowerCase().trim();

      filteredList = vocabList.filter(w => {
        // Custom category filter
        if (customCategory && (!w.isCustom || w.category !== customCategory)) {
          return false;
        }

        // HSK Version filter
        if (!w.isCustom && w.level !== 'premium' && (w.hskVersion || '3.0') !== activeHskVersion) {
          return false;
        }

        // HSK Level filter
        if (activeLevel !== 'all' && !matchLevel(w.level, activeLevel)) {
          return false;
        }

        // Status filter
        if (activeStatus === 'memorized' && !w.isMemorized) return false;
        if (activeStatus === 'unmemorized' && w.isMemorized) return false;
        if (activeStatus === 'starred' && !w.isStarred) return false;
        if (activeStatus === 'wrong' && !w.isWrong) return false;
        if (activeStatus === 'custom' && !w.isCustom) return false;

        // Search filter
        if (searchVal) {
          const matchWord = w.word.includes(searchVal);
          const matchPinyin = w.pinyin.toLowerCase().includes(searchVal);
          const matchMeaning = w.meaning.toLowerCase().includes(searchVal);
          return matchWord || matchPinyin || matchMeaning;
        }

        return true;
      });

      currentPage = 1;
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('detail-words-table-rows');
      if (!tbody) return;

      tbody.innerHTML = '';

      if (filteredList.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" style="text-align: center; padding: 48px; color: var(--text-muted); font-style: italic;">
              Không có từ vựng nào khớp với bộ lọc hiện tại.
            </td>
          </tr>
        `;
        document.getElementById('pagination-info').textContent = 'Hiển thị 0 - 0 trong tổng số 0 từ vựng';
        document.getElementById('pagination-buttons').innerHTML = '';
        return;
      }

      // Calculate pagination boundaries
      const totalWords = filteredList.length;
      const totalPages = Math.ceil(totalWords / pageSize);
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const startIdx = (currentPage - 1) * pageSize;
      const endIdx = Math.min(startIdx + pageSize, totalWords);

      const wordsToDisplay = filteredList.slice(startIdx, endIdx);

      wordsToDisplay.forEach(w => {
        const tr = document.createElement('tr');
        tr.style.borderBottom = '1px solid var(--border-glass)';
        tr.innerHTML = `
          <td style="font-family: var(--font-chinese); font-size: 1.3rem; font-weight: 500; padding: 14px 12px;">${w.word}</td>
          <td style="font-family: var(--font-display); padding: 14px 12px; color: var(--accent-teal); font-weight: 500;">${w.pinyin}</td>
          <td style="padding: 14px 12px;">${w.meaning}</td>
          <td style="padding: 14px 12px;"><span class="badge badge-level" style="margin: 0;">${w.isCustom ? 'Cá nhân ✏️' : (w.level === 'premium' ? 'Premium' : 'HSK ' + w.level + ' (v' + (w.hskVersion || '3.0') + ')')}</span></td>
          <td style="padding: 14px 12px; text-align: center;">
            <div style="display: flex; gap: 8px; justify-content: center; align-items: center;">
              <button class="circle-btn speak-row-btn" data-word="${w.word}" title="Nghe phát âm" style="width: 34px; height: 34px; font-size: 0.85rem; background: rgba(59, 130, 246, 0.1); color: var(--accent-blue); display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-volume-high"></i>
              </button>
              <button class="circle-btn star-row-btn ${w.isStarred ? 'active' : ''}" data-id="${w.id}" title="Yêu thích" style="width: 34px; height: 34px; font-size: 0.85rem; display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-star"></i>
              </button>
              <button class="circle-btn check-row-btn ${w.isMemorized ? 'active' : ''}" data-id="${w.id}" title="Đã thuộc" style="width: 34px; height: 34px; font-size: 0.85rem; display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-circle-check"></i>
              </button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Update pagination info
      document.getElementById('pagination-info').textContent = `Hiển thị ${startIdx + 1} - ${endIdx} trong tổng số ${totalWords} từ vựng`;

      // Draw pagination buttons
      renderPaginationButtons(totalPages);

      // Bind Speak Events
      tbody.querySelectorAll('.speak-row-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const word = btn.getAttribute('data-word');
          speakText(word);
        });
      });

      // Bind Star Toggles
      tbody.querySelectorAll('.star-row-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = parseInt(btn.getAttribute('data-id'));
          toggleWordStarred(id, btn);
        });
      });

      // Bind Check Toggles
      tbody.querySelectorAll('.check-row-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = parseInt(btn.getAttribute('data-id'));
          toggleWordMemorized(id, btn);
        });
      });
    }

    function renderPaginationButtons(totalPages) {
      const container = document.getElementById('pagination-buttons');
      if (!container) return;

      container.innerHTML = '';

      // Prev Button
      const prevBtn = document.createElement('button');
      prevBtn.className = 'page-btn';
      prevBtn.innerHTML = '<i class="fa-solid fa-chevron-left"></i>';
      prevBtn.disabled = currentPage === 1;
      prevBtn.addEventListener('click', () => {
        currentPage--;
        renderTable();
      });
      container.appendChild(prevBtn);

      // Draw page numbers dynamically (max 5 page numbers)
      const range = 2;
      let startPage = Math.max(1, currentPage - range);
      let endPage = Math.min(totalPages, currentPage + range);

      if (startPage > 1) {
        const firstBtn = document.createElement('button');
        firstBtn.className = 'page-btn';
        firstBtn.textContent = '1';
        firstBtn.addEventListener('click', () => {
          currentPage = 1;
          renderTable();
        });
        container.appendChild(firstBtn);

        if (startPage > 2) {
          const dots = document.createElement('span');
          dots.textContent = '...';
          dots.style.alignSelf = 'center';
          dots.style.margin = '0 4px';
          dots.style.color = 'var(--text-muted)';
          container.appendChild(dots);
        }
      }

      for (let p = startPage; p <= endPage; p++) {
        const pageBtn = document.createElement('button');
        pageBtn.className = `page-btn ${p === currentPage ? 'active' : ''}`;
        pageBtn.textContent = p;
        pageBtn.addEventListener('click', () => {
          currentPage = p;
          renderTable();
        });
        container.appendChild(pageBtn);
      }

      if (endPage < totalPages) {
        if (endPage < totalPages - 1) {
          const dots = document.createElement('span');
          dots.textContent = '...';
          dots.style.alignSelf = 'center';
          dots.style.margin = '0 4px';
          dots.style.color = 'var(--text-muted)';
          container.appendChild(dots);
        }

        const lastBtn = document.createElement('button');
        lastBtn.className = 'page-btn';
        lastBtn.textContent = totalPages;
        lastBtn.addEventListener('click', () => {
          currentPage = totalPages;
          renderTable();
        });
        container.appendChild(lastBtn);
      }

      // Next Button
      const nextBtn = document.createElement('button');
      nextBtn.className = 'page-btn';
      nextBtn.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.addEventListener('click', () => {
        currentPage++;
        renderTable();
      });
      container.appendChild(nextBtn);
    }

    let speechVoice = localStorage.getItem('speech_voice') || 'elevenlabs-adam';
    let speechPlaybackRate = parseFloat(localStorage.getItem('speech_playback_rate') || '1.0');
    let activeAudioElement = null;

    function cleanFrontendSpeechText(text) {
      if (!text) return '';
      let str = String(text).trim();
      str = str.replace(/<[^>]*>/g, '');
      // Strip both ASCII () and fullwidth Chinese （） parenthetical notes/parts of speech
      str = str.replace(/[\(\uff08][^\)\uff09]*[\)\uff09]/g, '');
      str = str.replace(/^[A-Z]:\s*/gm, '').replace(/\n[A-Z]:\s*/g, '，');
      if (str.includes('/') && !str.includes('http')) {
        str = str.split('/')[0].trim();
      }
      return str.trim();
    }

    function speakText(text) {
      if (!text) return;
      const cleanText = cleanFrontendSpeechText(text);
      if (!cleanText) return;

      if (activeAudioElement) {
        try {
          activeAudioElement.pause();
          activeAudioElement.currentTime = 0;
          activeAudioElement.src = '';
        } catch (e) { }
        activeAudioElement = null;
      }

      const voiceSelectEl = document.getElementById('tts-voice-select');
      const currentVoice = 'baidu-female';
      localStorage.setItem('speech_voice', 'baidu-female');

      const speedSelectEl = document.getElementById('tts-speed-select');
      const currentSpeed = (speedSelectEl && speedSelectEl.value) ? parseFloat(speedSelectEl.value) : (parseFloat(localStorage.getItem('speech_playback_rate')) || 1.0);

      const url = `${API_BASE_URL}/api/tts?text=${encodeURIComponent(cleanText)}&voice=${encodeURIComponent(currentVoice)}&_t=${Date.now()}`;
      const audio = new Audio(url);
      audio.playbackRate = currentSpeed;
      activeAudioElement = audio;

      audio.play().catch(err => {
        console.warn("ElevenLabs audio playback failed, retrying...", err);
        setTimeout(() => {
          audio.play().catch(e => console.error("Audio retry error:", e));
        }, 300);
      });
    }

    // iOS Safari & Mobile Audio Autoplay Unlocker
    function setupAudioUnlocker() {
      const unlock = () => {
        try {
          const silentAudio = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
          silentAudio.play().then(() => {
            document.removeEventListener('touchstart', unlock);
            document.removeEventListener('click', unlock);
          }).catch(() => { });
        } catch (e) { }
      };
      document.addEventListener('touchstart', unlock, { once: true });
      document.addEventListener('click', unlock, { once: true });
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setupAudioUnlocker);
    } else {
      setupAudioUnlocker();
    }



    async function toggleWordMemorized(id, btn) {
      const idx = vocabList.findIndex(w => w.id === id);
      if (idx === -1) return;

      const oldMemorized = vocabList[idx].isMemorized;
      const nextState = !oldMemorized;

      // Optimistic update
      vocabList[idx].isMemorized = nextState;
      applyFilters();
      showToast(nextState ? 'Đã thuộc từ này! 🎉 (+100 điểm)' : 'Đã bỏ thuộc! Từ này quay lại danh sách cần ôn tập ⚠️ (-100 điểm)');

      if (!currentUser) {
        const guestProgress = JSON.parse(localStorage.getItem('guest_progress') || '{}');
        if (!guestProgress[id]) guestProgress[id] = {};
        guestProgress[id].isMemorized = nextState;
        localStorage.setItem('guest_progress', JSON.stringify(guestProgress));
        return;
      }

      try {
        const response = await fetch(API_BASE_URL + '/api/vocabulary/toggle-memorized', {
          method: 'POST',
          headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ id }),
          credentials: 'include'
        });

        if (response.status === 401) {
          // Rollback local state
          vocabList[idx].isMemorized = oldMemorized;
          applyFilters();

          localStorage.removeItem('user');
          localStorage.removeItem('session_token');
          currentUser = null;
          showToast('Phiên làm việc đã hết hạn. Đang chạy chế độ khách...', true);

          const guestProgress = JSON.parse(localStorage.getItem('guest_progress') || '{}');
          if (!guestProgress[id]) guestProgress[id] = {};
          guestProgress[id].isMemorized = !oldMemorized;
          vocabList[idx].isMemorized = !oldMemorized;
          localStorage.setItem('guest_progress', JSON.stringify(guestProgress));
          applyFilters();
          return;
        }

        if (!response.ok) throw new Error();
        const updated = await response.json();
        Object.assign(vocabList[idx], updated);
        applyFilters();
      } catch (err) {
        console.error(err);
        showToast('Lỗi đồng bộ trạng thái!', true);

        // Rollback state on error
        vocabList[idx].isMemorized = oldMemorized;
        applyFilters();
      }
    }

    async function toggleWordStarred(id, btn) {
      const idx = vocabList.findIndex(w => w.id === id);
      if (idx === -1) return;

      const oldStarred = vocabList[idx].isStarred;
      const nextState = !oldStarred;

      // Optimistic update
      vocabList[idx].isStarred = nextState;
      applyFilters();
      showToast(nextState ? 'Đã thêm vào yêu thích ⭐' : 'Đã bỏ yêu thích.');

      if (!currentUser) {
        const guestProgress = JSON.parse(localStorage.getItem('guest_progress') || '{}');
        if (!guestProgress[id]) guestProgress[id] = {};
        guestProgress[id].isStarred = nextState;
        localStorage.setItem('guest_progress', JSON.stringify(guestProgress));
        return;
      }

      try {
        const response = await fetch(API_BASE_URL + '/api/vocabulary/toggle-starred', {
          method: 'POST',
          headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
          body: JSON.stringify({ id }),
          credentials: 'include'
        });

        if (response.status === 401) {
          // Rollback local state
          vocabList[idx].isStarred = oldStarred;
          applyFilters();

          localStorage.removeItem('user');
          localStorage.removeItem('session_token');
          currentUser = null;
          showToast('Phiên làm việc đã hết hạn. Đang chạy chế độ khách...', true);

          const guestProgress = JSON.parse(localStorage.getItem('guest_progress') || '{}');
          if (!guestProgress[id]) guestProgress[id] = {};
          guestProgress[id].isStarred = !oldStarred;
          vocabList[idx].isStarred = !oldStarred;
          localStorage.setItem('guest_progress', JSON.stringify(guestProgress));
          applyFilters();
          return;
        }

        if (!response.ok) throw new Error();
        const updated = await response.json();
        Object.assign(vocabList[idx], updated);
        applyFilters();
      } catch (err) {
        console.error(err);
        showToast('Lỗi đồng bộ yêu thích!', true);

        // Rollback state on error
        vocabList[idx].isStarred = oldStarred;
        applyFilters();
      }
    }

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.style.borderLeftColor = isError ? 'var(--danger)' : 'var(--accent-blue)';
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }
