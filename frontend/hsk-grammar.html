<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tổng Hợp Ngữ Pháp Tiếng Trung HSK 1 - 6 | Hongtai Chinese</title>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: rgba(15, 23, 42, 0.75);
      --border-glass: rgba(255, 255, 255, 0.1);
      --primary: #3b82f6;
      --accent: #f59e0b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
    }

    /* Header */
    .grammar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding: 24px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .title-group h1 {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-group p {
      color: var(--text-sub);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    /* Search & Filter Bar */
    .controls-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-wrap {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-wrap i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
      font-size: 1.1rem;
    }

    .search-input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    /* Navigation Tabs */
    .level-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 24px;
    }

    .tab-btn {
      padding: 12px 22px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      color: var(--text-sub);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.4);
    }

    /* Main Content Reader Container */
    .reader-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      min-height: 500px;
    }

    .reader-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-glass);
      padding-bottom: 18px;
      margin-bottom: 24px;
    }

    .reader-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .level-badge {
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    /* Grammar Formatting Body */
    .grammar-body {
      font-size: 1.05rem;
      line-height: 1.8;
      color: #cbd5e1;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .grammar-body b, .grammar-body strong {
      color: #fbbf24;
      font-weight: 700;
    }

    .grammar-body .zh-text {
      color: #60a5fa;
      font-size: 1.15rem;
      font-weight: 700;
      background: rgba(59, 130, 246, 0.1);
      padding: 2px 6px;
      border-radius: 6px;
      cursor: pointer;
    }

    .grammar-body .zh-text:hover {
      background: rgba(59, 130, 246, 0.25);
    }

    /* Audio Speaker Float Button */
    .audio-btn {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid #f59e0b;
      color: #fbbf24;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 700;
      transition: all 0.2s;
    }

    .audio-btn:hover {
      background: #f59e0b;
      color: #000;
    }

    .btn-close {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-glass);
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-close:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border-color: #ef4444;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Header -->
    <div class="grammar-header">
      <div class="title-group">
        <h1><i class="fa-solid fa-book-open-reader"></i> Chuyên Trang Ngữ Pháp HSK (HSK 1 đến HSK 6)</h1>
        <p>Hệ thống tra cứu, tổng hợp lý thuyết ngữ pháp toàn diện bóc tách từ bộ tài liệu chuẩn thi HSK</p>
      </div>
      <div>
        <button class="btn-close" onclick="window.close()"><i class="fa-solid fa-xmark"></i> Đóng Cửa Sổ</button>
      </div>
    </div>

    <!-- Search & Filter Controls -->
    <div class="controls-bar">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-grammar-input" class="search-input"
          placeholder="Tim kiếm điểm ngữ pháp, từ khóa (Ví dụ: 把, 被, 比, 越来越, 结果补语)..."
          onkeyup="filterGrammarContent()">
      </div>
    </div>

    <!-- Level Navigation Tabs -->
    <div class="level-tabs">
      <button class="tab-btn active" data-level="hsk1" onclick="switchLevelTab('hsk1')">
        <i class="fa-solid fa-seedling"></i> HSK 1
      </button>
      <button class="tab-btn" data-level="hsk2" onclick="switchLevelTab('hsk2')">
        <i class="fa-solid fa-graduation-cap"></i> HSK 2
      </button>
      <button class="tab-btn" data-level="hsk3" onclick="switchLevelTab('hsk3')">
        <i class="fa-solid fa-book-bookmark"></i> HSK 3
      </button>
      <button class="tab-btn" data-level="hsk4" onclick="switchLevelTab('hsk4')">
        <i class="fa-solid fa-star"></i> HSK 4
      </button>
      <button class="tab-btn" data-level="hsk5" onclick="switchLevelTab('hsk5')">
        <i class="fa-solid fa-award"></i> HSK 5
      </button>
      <button class="tab-btn" data-level="hsk6" onclick="switchLevelTab('hsk6')">
        <i class="fa-solid fa-crown"></i> HSK 6
      </button>
    </div>

    <!-- Main Reader Display Area -->
    <div class="reader-card">
      <div class="reader-header">
        <div class="reader-title">
          <span id="current-title">Tổng Hợp Ngữ Pháp HSK 1</span>
          <span id="current-badge" class="level-badge">HSK 1</span>
        </div>
        <div>
          <a id="download-pdf-btn" href="/grammar-files/ngu phap hsk 1.pdf" download target="_blank" class="audio-btn" style="text-decoration: none;">
            <i class="fa-solid fa-file-pdf"></i> Tải File Sách PDF
          </a>
        </div>
      </div>

      <div id="grammar-content-box" class="grammar-body">
        <div style="text-align: center; padding: 40px; color: var(--text-sub);">
          <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
          <p style="margin-top: 12px;">Đang tải toàn bộ dữ liệu ngữ pháp HSK...</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    let allGrammarData = {};
    let currentActiveLevel = 'hsk1';

    function getApiBaseUrl() {
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '') {
        return 'http://localhost:5000';
      }
      return window.location.origin;
    }

    const pdfMap = {
      'hsk1': `${getApiBaseUrl()}/grammar-files/ngu phap hsk 1.pdf`,
      'hsk2': `${getApiBaseUrl()}/grammar-files/ngu phap hsk 2.pdf`,
      'hsk3': `${getApiBaseUrl()}/grammar-files/ngu phap hsk 3.pdf`,
      'hsk4': `${getApiBaseUrl()}/grammar-files/ngu phap hsk 4.pdf`,
      'hsk5': `${getApiBaseUrl()}/grammar-files/ngu phap hsk 5.pdf`,
      'hsk6': `${getApiBaseUrl()}/grammar-files/ngu phap hsk 6.pdf`
    };

    document.addEventListener('DOMContentLoaded', () => {
      fetchGrammarData();
    });

    function fetchGrammarData() {
      const API_BASE_URL = getApiBaseUrl();

      fetch(`${API_BASE_URL}/api/grammar/full-content`)
        .then(res => {
          if (!res.ok) throw new Error('API response not ok');
          return res.json();
        })
        .then(data => {
          allGrammarData = data;
          renderGrammarContent(currentActiveLevel);
        })
        .catch(err => {
          console.warn("API load failed, fallback to built-in grammar dataset:", err);
          // Fallback static dataset so it never fails on any domain/environment
          allGrammarData = {
            'hsk1': {
              id: 'hsk1',
              level: 'HSK 1',
              title: 'Ngữ Pháp HSK 1 Chi Tiết',
              content: `1. Đại từ nhân xưng:
我 (wǒ): tôi, tớ, mình
你 (nǐ): bạn, cậu, anh, chị
他 (tā): anh ấy, cậu ấy
她 (tā): cô ấy, chị ấy
我们 (wǒmen): chúng tôi
你们 (nǐmen): các bạn
 capitalization, 他 / 她 / 它

2. Đại từ chỉ thị:
这 (zhè): đây, này
那 (nà): kia, đó
这儿 (zhèr): ở đây
那儿 (nàr): ở đó

3. Đại từ nghi vấn:
谁 (shéi): ai
什么 (shénme): cái gì
哪 (nǎ): nào, cái nào
哪儿 (nǎr): ở đâu
多少 (duōshao): bao nhiêu
几 (jǐ): mấy
怎么 (zěnme): làm sao, thế nào
怎么样 (zěnmeyàng): thế nào, ra sao

4. Phó từ mức độ & phủ định:
不 (bù): không (dùng ở hiện tại, tương lai, sự thật)
没 (méi): chưa, không (dùng phủ định cho quá khứ hoặc sở hữu 有)
很 (hěn): rất
太 (tài): quá (cấu trúc: 太 + Adj + 了)
都 (dōu): đều

5. Cấu trúc câu đặc biệt:
- Câu chữ 是 (shì): 我是学生 (Tôi là học sinh)
- Câu chữ 有 (yǒu): 我有一本书 (Tôi có một cuốn sách)
- Cấu trúc nhấn mạnh 是...的: 我是昨天来的 (Tôi đến từ hôm qua)
- Trạng thái hành động đang diễn ra 在...呢: 他在吃饭呢 (Anh ấy đang ăn cơm)`
            },
            'hsk2': {
              id: 'hsk2',
              level: 'HSK 2',
              title: 'Ngữ Pháp HSK 2 Chi Tiết',
              content: `1. Đại từ nhân xưng nâng cao:
您 (nín): ngài, ông, bà (xưng hô lịch sự)
它 (tā): nó (chỉ vật, động vật)
大家 (dàjiā): mọi người

2. Phó từ quan trọng:
最 (zuì): nhất (最喜欢, 最好)
非常 (fēicháng): vô cùng, rất
别 (bié): đừng (别去, 别吃)
再 (zài): lại (diễn tả hành động chưa xảy ra hoặc lặp lại)
就 (jiù): là, ngay, đã (diễn tả sự việc xảy ra sớm, nhanh)

3. Giới từ chỉ phương hướng & so sánh:
从 (cóng): từ (从北京到上海)
对 (duì): đối với (对身体很好)
比 (bǐ): so với ( câu so sánh: A 比 B + Adj)
向 (xiàng): hướng về (向他学习)

4. Cấu trúc câu quan trọng:
- Câu bị động với 被 (bèi)
- Câu nhấn mạnh với 着 (zhe): 门开着 (Cửa đang mở)
- Động từ trùng điệp: 看看, 听听, 休息休息`
            },
            'hsk3': {
              id: 'hsk3',
              level: 'HSK 3',
              title: 'Ngữ Pháp HSK 3 Chi Tiết',
              content: `1. Các loại Bổ Ngữ trọng tâm:
- Bổ ngữ kết quả (BNKQ): 洗好, 看懂, 找到, 听懂
- Bổ ngữ trạng thái (BNTT): 跑得快, 学得好
- Bổ ngữ khả năng (BNKN): 看得懂, 看不懂, 买得到
- Bổ ngữ xu hướng đơn & phức tạp: 拿出来, 跑过去, 站起来

2. Câu chữ 把 (bǎ) chuyên sâu:
- Cấu trúc: A + 把 + B + Động từ + Thành phần khác
- Ví dụ: 请把门关上 (Xin hãy đóng cửa lại)

3. Cấu trúc liên kết:
- 越...越... (càng... càng...): 越来越好
- 一边...一边... (vừa... vừa...): 一边吃饭一边看电视
- 除了...以外 (ngoài... ra): 除了他,  getUsers đều đi`
            },
            'hsk4': {
              id: 'hsk4',
              level: 'HSK 4',
              title: 'Ngữ Pháp HSK 4 Chi Tiết',
              content: `1. Câu Tồn Hiện (Existential Sentences):
- Nơi chốn + Động từ + 着/了 + Tân ngữ
- Ví dụ: 桌子上放着一本书 (Trên bàn có để một cuốn sách)

2. Bổ ngữ khả năng mở rộng:
- V + 得 / 不 + 了 (liǎo): 吃不了 (ăn không hết / không thể ăn)
- V + 得 / 不 + 动 (dòng): 走不动 (đi không nổi)
- V + 得 / 不 + 住 (zhù): 记住 (ghi nhớ được)

3. Phó từ liên kết & Cặp liên từ HSK 4:
- 尽管...可是... (Cho dù... nhưng...)
- 只要...就... (Chỉ cần... thì...)
- 只有...才... (Chỉ có... mới...)`
            },
            'hsk5': {
              id: 'hsk5',
              level: 'HSK 5',
              title: 'Ngữ Pháp HSK 5 Chi Tiết',
              content: `1. Phân biệt từ ngữ đồng nghĩa HSK 5:
- 毕竟 (bìjìng) vs 到底 (dàodǐ)
- 逐渐 (zhújiàn) vs 逐步 (zhúbù)

2. Cấu trúc giả định & nhượng bộ cao cấp:
- 宁可...也不... (Thà... còn hơn...)
- 与其...不如... (Thay vì... không bằng...)
- 哪怕...也... (Cho dù... cũng...)`
            },
            'hsk6': {
              id: 'hsk6',
              level: 'HSK 6',
              title: 'Ngữ Pháp HSK 6 Chi Tiết',
              content: `1. Ngữ pháp thi đọc hiểu & viết văn HSK 6:
- Cấu trúc câu phức hợp đỉnh cao HSK 6
- Cách sửa lỗi sai trong câu (Sửa câu sai HSK 6)
- Kỹ năng phân tích ngữ pháp trong bài đọc dài 1000 từ.`
            }
          };
          renderGrammarContent(currentActiveLevel);
        });
    }

    window.switchLevelTab = function (levelId) {
      currentActiveLevel = levelId;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        if (btn.getAttribute('data-level') === levelId) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      document.getElementById('download-pdf-btn').href = pdfMap[levelId] || '#';
      renderGrammarContent(levelId);
    };

    function renderGrammarContent(levelId, filterQuery = '') {
      const item = allGrammarData[levelId];
      const box = document.getElementById('grammar-content-box');
      const titleEl = document.getElementById('current-title');
      const badgeEl = document.getElementById('current-badge');

      if (!item || !item.content) {
        box.innerHTML = `<div style="text-align: center; padding: 30px;">Chưa có nội dung cho cấp độ này.</div>`;
        return;
      }

      titleEl.textContent = item.title || `Tổng Hợp Ngữ Pháp ${levelId.toUpperCase()}`;
      badgeEl.textContent = item.level || levelId.toUpperCase();

      let text = item.content;

      if (filterQuery) {
        const lines = text.split('\n');
        const matchedLines = lines.filter(l => l.toLowerCase().includes(filterQuery.toLowerCase()));
        if (matchedLines.length > 0) {
          text = `--- KẾT QUẢ TÌM KIẾM CHO TỪ KHÓA "${filterQuery}" (${matchedLines.length} DÒNG NỔI BẬT) ---\n\n` + matchedLines.join('\n');
        } else {
          text = `Không tìm thấy kết quả phù hợp cho từ khóa "${filterQuery}" trong ${item.level}.`;
        }
      }

      // Format Chinese text highlighting
      const formattedHtml = text.replace(/([一-龥]+)/g, '<span class="zh-text" onclick="speakZhText(\'$1\')">$1</span>');

      box.innerHTML = formattedHtml;
    }

    window.filterGrammarContent = function () {
      const query = document.getElementById('search-grammar-input').value.trim();
      renderGrammarContent(currentActiveLevel, query);
    };

    let audioCurrent = null;
    window.speakZhText = function (text) {
      if (!text) return;
      if (audioCurrent) {
        audioCurrent.pause();
      }
      const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === ''
        ? 'http://localhost:5000'
        : 'https://tieng-trung-hong-tai.onrender.com';

      const voice = localStorage.getItem('speech_voice') || 'baidu-female';
      const audioUrl = `${API_BASE_URL}/api/tts?text=${encodeURIComponent(text)}&voice=${voice}`;

      audioCurrent = new Audio(audioUrl);
      audioCurrent.play().catch(err => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'zh-CN';
          window.speechSynthesis.speak(u);
        }
      });
    };
  </script>
</body>

</html>
