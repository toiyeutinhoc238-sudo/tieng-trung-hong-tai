<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bộ Thủ Tiếng Trung | Hongtai Chinese</title>
  <meta name="description" content="Trọn bộ các bộ thủ tiếng Trung thông dụng, phiên âm Pinyin, tên Hán-Việt, ý nghĩa và phương pháp phân biệt các bộ thủ giống nhau.">
  <link rel="canonical" href="https://tieng-trung-hong-tai-1.onrender.com/chinese-radicals.html" />
  <link rel="icon" type="image/png" href="./src/assets/logo.png">

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Mali:wght@600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    (function () {
      var t = localStorage.getItem('theme') || 'dark';
      var bgUrl = t === 'light' ? "url('/assets/app_bg_day_v3.png')" : "url('/assets/app_bg_night_v3.png')";
      document.documentElement.style.setProperty('background-image', bgUrl, 'important');
      document.documentElement.style.setProperty('background-size', 'cover', 'important');
      document.documentElement.style.setProperty('background-position', 'center center', 'important');
      document.documentElement.style.setProperty('background-attachment', 'fixed', 'important');
      document.documentElement.style.setProperty('background-repeat', 'no-repeat', 'important');

      if (t === 'light') {
        document.documentElement.classList.add('light-mode', 'light');
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light', 'light-mode');
      }
    })();

    window.toggleTheme = function() {
      var isLight = document.documentElement.classList.contains('light-mode') || document.documentElement.classList.contains('light');
      var nextDark = isLight;
      var bgUrl = nextDark ? "url('/assets/app_bg_night_v3.png')" : "url('/assets/app_bg_day_v3.png')";

      document.documentElement.style.setProperty('background-image', bgUrl, 'important');

      if (nextDark) {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light', 'light-mode');
        localStorage.setItem('theme', 'dark');
      } else {
        document.documentElement.classList.add('light', 'light-mode');
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      }
    };
  </script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --font-hanzi: 'Noto Sans SC', sans-serif;
      --font-pinyin: 'Be Vietnam Pro', sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Be Vietnam Pro', sans-serif;
      color: #f8fafc;
      min-height: 100vh;
      background-attachment: fixed;
      background-size: cover;
      background-position: center;
    }
    html.light-mode body {
      color: #0f172a;
    }
    .page-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 60px 16px;
    }
    .header-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    html.light-mode .header-card {
      background: rgba(255, 255, 255, 0.85);
      border-color: rgba(0, 0, 0, 0.1);
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .tabs-bar {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 24px;
    }
    .rad-tab-btn {
      background: rgba(255, 255, 255, 0.06);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 22px;
      border-radius: 99px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    html.light-mode .rad-tab-btn {
      background: #ffffff;
      color: #475569;
      border-color: #cbd5e1;
    }
    .rad-tab-btn:hover {
      background: rgba(37, 99, 235, 0.15);
      color: #3b82f6;
      border-color: rgba(37, 99, 235, 0.4);
    }
    .rad-tab-btn.active {
      background: linear-gradient(135deg, #2563eb, #1d4ed8) !important;
      color: #ffffff !important;
      border-color: #2563eb !important;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }
    .rad-card {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.25s ease;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }
    html.light-mode .rad-card {
      background: rgba(255, 255, 255, 0.85);
      border-color: rgba(0, 0, 0, 0.1);
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    }
    .rad-card:hover {
      transform: translateY(-4px);
      border-color: #3b82f6;
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.25);
    }
    .back-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    html.light-mode .back-btn {
      background: #ffffff;
      color: #0f172a;
      border-color: #cbd5e1;
    }
    .back-btn:hover {
      background: #2563eb;
      color: #fff;
      border-color: #2563eb;
    }
  </style>
</head>

<body>
  <div class="page-container">
    <!-- Header -->
    <div class="header-card">
      <div style="display: flex; align-items: center; gap: 16px;">
        <div style="background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; width: 54px; height: 54px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);">
          <i class="fa-solid fa-shapes"></i>
        </div>
        <div>
          <h1 style="font-size: 1.75rem; font-weight: 800; margin: 0; letter-spacing: -0.01em;">Bộ thủ Tiếng Trung</h1>
          <p style="font-size: 0.92rem; color: #94a3b8; margin: 4px 0 0 0;">Nắm vững cấu trúc nét chữ, phiên âm, Hán-Việt & mẹo phân biệt các bộ thủ</p>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px;">
        <a href="/" class="back-btn">
          <i class="fa-solid fa-arrow-left"></i> Trang chủ
        </a>
        <button onclick="window.toggleTheme()" class="back-btn" style="cursor: pointer;">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </div>

    <!-- Top Section Tabs (Tương thích hình 2) -->
    <div class="tabs-bar">
      <button class="rad-tab-btn active" id="tab-50-1" onclick="window.switchRadicalPageTab('50 bộ (1)')">50 bộ (1)</button>
      <button class="rad-tab-btn" id="tab-50-2" onclick="window.switchRadicalPageTab('50 bộ (2)')">50 bộ (2)</button>
      <button class="rad-tab-btn" id="tab-50-3" onclick="window.switchRadicalPageTab('50 bộ (3)')">50 bộ (3)</button>
      <button class="rad-tab-btn" id="tab-rest" onclick="window.switchRadicalPageTab('Còn lại')">Còn lại</button>
      <button class="rad-tab-btn" id="tab-comp" onclick="window.switchRadicalPageTab('So sánh')">Phân biệt</button>
    </div>

    <!-- Content Area -->
    <div id="radicals-content-area"></div>
  </div>

  <!-- Radical Detail Modal (Khung học chi tiết chuẩn như thiết kế hình 2) -->
  <div id="radical-detail-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); z-index: 99999; align-items: center; justify-content: center; padding: 16px;">
    <div style="background: var(--bg-primary, #1e293b); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; width: 100%; max-width: 720px; padding: 28px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); position: relative; color: #fff;">
      <button onclick="document.getElementById('radical-detail-modal').style.display='none'" style="position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.1); border: none; color: #94a3b8; font-size: 1.4rem; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">&times;</button>
      
      <div id="radical-detail-card-body"></div>
    </div>
  </div>

  <script src="/assets/hanzi-writer.min.js"></script>
  <script type="module" src="/src/radicals_page.js"></script>
</body>

</html>
