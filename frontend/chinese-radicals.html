  <script>
    (function () {
      var t = localStorage.getItem('theme') || 'dark';
      var bgUrl = t === 'light' ? "url('/assets/app_bg_day_v3.png')" : "url('/assets/app_bg_night_v3.png')";
      document.documentElement.style.setProperty('background-image', bgUrl, 'important');
      document.documentElement.style.setProperty('background-size', 'cover', 'important');
      document.documentElement.style.setProperty('background-position', 'center center', 'important');
      document.documentElement.style.setProperty('background-attachment', 'fixed', 'important');
      document.documentElement.style.setProperty('background-repeat', 'no-repeat', 'important');

      if (t === 'light') {
        document.documentElement.classList.add('light-mode', 'light');
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light', 'light-mode');
      }
    })();

    window.toggleTheme = function() {
      var isLight = document.documentElement.classList.contains('light-mode') || document.documentElement.classList.contains('light');
      var nextDark = isLight;
      var bgUrl = nextDark ? "url('/assets/app_bg_night_v3.png')" : "url('/assets/app_bg_day_v3.png')";

      document.documentElement.style.setProperty('background-image', bgUrl, 'important');

      if (nextDark) {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light', 'light-mode');
        localStorage.setItem('theme', 'dark');
        updateToggleBtns(false);
      } else {
        document.documentElement.classList.add('light', 'light-mode');
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        updateToggleBtns(true);
      }
    };

    function updateToggleBtns(isLight) {
      var btn = document.getElementById('theme-toggle-btn');
      if (btn) {
        btn.innerHTML = isLight 
          ? '<i class="fa-solid fa-moon" style="color:#d97706;"></i>' 
          : '<i class="fa-solid fa-sun" style="color:#f59e0b;"></i>';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      var isLight = document.documentElement.classList.contains('light-mode') || document.documentElement.classList.contains('light');
      updateToggleBtns(isLight);
    });
  </script>

        <button onclick="window.toggleRadicalFullscreen()" id="radical-top-fullscreen-btn" class="top-circle-btn" title="Bật/Tắt Toàn Màn Hình (Phím F)">
          <i class="fa-solid fa-expand" style="color: #38bdf8;"></i>
        </button>

        <a href="/" class="top-home-btn" title="Trang chủ">
          <i class="fa-solid fa-house"></i>
        </a>
      </div>
    </div>

    <!-- VIEW 1: GRID MODE (MẶC ĐỊNH HÌNH 1) -->
    <div id="radicals-grid-view">
      <!-- Tabs Bar & Học Flashcard Button -->
      <div class="tabs-bar">
        <div class="tabs-group">
          <button class="rad-tab-btn active" id="tab-50-1" onclick="window.switchRadicalPageTab('50 bộ (1)')">50 bộ (1)</button>
          <button class="rad-tab-btn" id="tab-50-2" onclick="window.switchRadicalPageTab('50 bộ (2)')">50 bộ (2)</button>
          <button class="rad-tab-btn" id="tab-50-3" onclick="window.switchRadicalPageTab('50 bộ (3)')">50 bộ (3)</button>
          <button class="rad-tab-btn" id="tab-rest" onclick="window.switchRadicalPageTab('Còn lại')">Còn lại</button>
          <button class="rad-tab-btn" id="tab-comp" onclick="window.switchRadicalPageTab('So sánh')">Phân biệt</button>
        </div>

        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <button class="print-mode-btn" onclick="window.printRadicalWorksheet()" style="background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 10px 18px; border-radius: 99px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-print"></i> <span id="print-mode-btn-text">In Phiếu Tập Tô (50 Bộ)</span>
          </button>
          <button class="flashcard-mode-btn" onclick="window.startRadicalFlashcardMode()">
            <i class="fa-solid fa-layer-group"></i> Học Flashcard
          </button>
        </div>
      </div>

      <!-- Main Cards Grid -->
      <div id="radicals-content-area"></div>
    </div>

    <!-- VIEW 2: FLASHCARD STUDY MODE (HÌNH 2 HERO + LIST) -->
    <div id="radicals-flashcard-view" style="display: none;">
      <!-- Flashcard Header Control Bar -->
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
          <button class="back-list-btn" onclick="window.showGridView()">
            <i class="fa-solid fa-arrow-left"></i> Quay lại danh sách
          </button>
          <button id="radical-fullscreen-toggle-btn" class="fc-fullscreen-toggle-btn" onclick="window.toggleRadicalFullscreen()" title="Phóng to toàn màn hình (Phím F)">
            <i class="fa-solid fa-expand"></i> <span class="fs-btn-label">Toàn màn hình</span>
          </button>
        </div>

        <div style="font-weight: 800; font-size: 1.1rem; color: #3b82f6; display: flex; align-items: center; gap: 8px;">
          <i class="fa-solid fa-layer-group"></i> Chế Độ Học Flashcard Bộ Thủ
        </div>
      </div>

      <!-- Hero Flashcard Stage -->
      <div class="hero-stage-wrapper">
        <button class="stage-arrow-btn" onclick="window.prevRadicalFlashcard()" title="Thẻ trước (&larr;)">
          <i class="fa-solid fa-chevron-left"></i>
        </button>

        <div class="hero-flashcard-card" id="hero-flashcard-card">
          <div id="hero-card-content"></div>
        </div>

        <button class="stage-arrow-btn" onclick="window.nextRadicalFlashcard()" title="Thẻ tiếp theo (&rarr;)">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <!-- Bottom Carousel / List -->
      <div class="bottom-list-card">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 8px;">
          <div style="font-size: 1.15rem; font-weight: 800; color: #3b82f6; display: flex; align-items: center; gap: 8px;">
            <i class="fa-solid fa-list-ul"></i> Danh sách bộ thủ ( <span id="radicals-count-badge" style="color: #60a5fa; font-weight: 800;">213 bộ thủ</span> )
          </div>

          <div style="font-size: 0.85rem; font-weight: 600; color: #94a3b8; display: flex; align-items: center; gap: 6px;">
            <i class="fa-solid fa-keyboard"></i> Phím &larr; &rarr; để đổi thẻ | Phím Spacebar để nghe phát âm
          </div>
        </div>

        <div class="mini-cards-grid" id="mini-cards-grid"></div>
      </div>
    </div>

  </div>

  <!-- Floating Theme & Fullscreen Toggle Widget (Bottom-Left) -->
  <div id="floating-theme-widget" class="floating-theme-widget">
    <button id="floating-theme-toggle-btn" onclick="window.toggleTheme && window.toggleTheme()" title="Chuyển đổi Sáng/Tối"
      style="width: 54px; height: 54px; border-radius: 50%; background: var(--bg-card, rgba(15,23,42,0.8)); border: 2px solid var(--border-glass, rgba(255,255,255,0.22)); color: var(--text-primary, #ffffff); font-size: 1.4rem; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); touch-action: manipulation; -webkit-tap-highlight-color: transparent;">
      <i class="fa-solid fa-moon"></i>
    </button>
    <button id="particle-toggle-btn" class="particle-toggle-btn" onclick="window.toggleSeasonalParticles && window.toggleSeasonalParticles()" title="Bật/Tắt hiệu ứng mùa"
      style="width: 54px; height: 54px; border-radius: 50%; background: var(--bg-card, rgba(15,23,42,0.8)); border: 2px solid var(--border-glass, rgba(255,255,255,0.22)); color: #60a5fa; font-size: 1.4rem; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); touch-action: manipulation; -webkit-tap-highlight-color: transparent;">
      <i class="fa-solid fa-snowflake"></i>
    </button>
    <button id="floating-fullscreen-btn" class="fc-circle-btn" onclick="window.toggleAppFullscreen()" title="Bật/Tắt Toàn Màn Hình (Phím F)"
      style="width: 54px; height: 54px; font-size: 1.4rem; touch-action: manipulation; -webkit-tap-highlight-color: transparent;">
      <i class="fa-solid fa-expand"></i>
    </button>
  </div>

  <script src="/assets/hanzi-writer.min.js"></script>
  <script type="module" src="/src/particles.js"></script>
  <script type="module" src="/src/screen_drawing.js"></script>
  <script type="module" src="/src/radicals_page.js"></script>
  <script type="module" src="/src/global_sidebar.js"></script>
</body>

</html>
