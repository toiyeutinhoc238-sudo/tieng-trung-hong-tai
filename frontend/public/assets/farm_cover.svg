            <g class="fs-blades"><rect x="-4" y="-74" width="8" height="74" rx="3" fill="#fff8ea" stroke="#b9875a" stroke-width="2"/><rect x="-4" y="-74" width="8" height="74" rx="3" fill="#fff8ea" stroke="#b9875a" stroke-width="2" transform="rotate(90)"/><rect x="-4" y="-74" width="8" height="74" rx="3" fill="#fff8ea" stroke="#b9875a" stroke-width="2" transform="rotate(180)"/><rect x="-4" y="-74" width="8" height="74" rx="3" fill="#fff8ea" stroke="#b9875a" stroke-width="2" transform="rotate(270)"/><circle r="7" fill="#7a4a26"/></g></g>
          <path d="M0 450 Q 260 380 560 430 T 1280 420 V720 H0Z" fill="url(#fsHill2)"/>
