          <path d="M600 655 L1280 610 V720 H640Z" fill="url(#fsWheat)"/>
          <path d="M0 560 Q 300 520 520 580 T 1280 640 V720 H0Z" fill="#5aa845"/>
          <!-- hàng rào -->
          <g stroke="#b07a46" stroke-width="7" stroke-linecap="round"><path d="M0 590 L560 600"/><path d="M0 618 L560 626"/></g>
          <g fill="#d39a5d" stroke="#8a5a2c" stroke-width="3"><rect x="10" y="570" width="14" height="66" rx="4"/><rect x="76" y="571" width="14" height="66" rx="4"/><rect x="142" y="572" width="14" height="66" rx="4"/><rect x="208" y="573" width="14" height="66" rx="4"/><rect x="274" y="574" width="14" height="66" rx="4"/><rect x="340" y="575" width="14" height="66" rx="4"/><rect x="406" y="576" width="14" height="66" rx="4"/><rect x="472" y="577" width="14" height="66" rx="4"/><rect x="538" y="578" width="14" height="66" rx="4"/></g>
          <!-- gà, hoa -->
          <g class="fs-hen" transform="translate(360 650)"><ellipse rx="22" ry="17" fill="#fff"/><circle cx="16" cy="-14" r="10" fill="#fff"/><path d="M14 -26 l4 -6 l4 6 l4 -6 l2 8Z" fill="#e53935"/><path d="M26 -14 l9 3 l-9 3Z" fill="#ffb300"/><circle cx="19" cy="-16" r="2" fill="#333"/></g>
          <g fill="#ff8fb1"><circle cx="90" cy="690" r="8"/><circle cx="140" cy="702" r="7" fill="#fff176"/><circle cx="480" cy="700" r="8"/><circle cx="1220" cy="700" r="8" fill="#fff176"/></g>
