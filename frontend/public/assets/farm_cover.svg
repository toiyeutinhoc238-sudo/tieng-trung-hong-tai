<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 150 1000 560" width="1000" height="560" preserveAspectRatio="xMidYMid slice">
  <style>
    .fs-cloud { animation: d 38s linear infinite alternate; }
    .fs-cloud.c2 { animation-duration: 52s; animation-direction: alternate-reverse; }
    .fs-cloud.c3 { animation-duration: 30s; }
    @keyframes d { from { transform: translateX(-60px); } to { transform: translateX(90px); } }
    .fs-blades { animation: s 9s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
          <defs>
            <linearGradient id="fsSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc8f2"/><stop offset="0.6" stop-color="#bfe6fb"/><stop offset="1" stop-color="#fff1c9"/></linearGradient>
            <linearGradient id="fsHill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd27a"/><stop offset="1" stop-color="#6fb552"/></linearGradient>
            <linearGradient id="fsHill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fc35e"/><stop offset="1" stop-color="#4f9c3f"/></linearGradient>
            <pattern id="fsRows" width="46" height="24" patternUnits="userSpaceOnUse" patternTransform="skewX(-28)"><rect width="46" height="24" fill="#c98a4b"/><rect width="46" height="9" fill="#a96d36"/><circle cx="12" cy="16" r="5" fill="#69b347"/><circle cx="34" cy="16" r="5" fill="#69b347"/></pattern>
            <pattern id="fsWheat" width="22" height="30" patternUnits="userSpaceOnUse"><rect width="22" height="30" fill="#f0c64a"/><path d="M5 30 V8 M16 30 V4" stroke="#d29a20" stroke-width="3"/><ellipse cx="5" cy="8" rx="3" ry="6" fill="#ffe08a"/><ellipse cx="16" cy="4" rx="3" ry="6" fill="#ffe08a"/></pattern>
          </defs>
          <rect width="1280" height="720" fill="url(#fsSky)"/>
          <circle cx="1090" cy="120" r="62" fill="#ffe37a"/><circle cx="1090" cy="120" r="90" fill="#ffe37a" opacity="0.25"/><circle cx="1040" cy="200" r="46" fill="#ffe37a"/><circle cx="1040" cy="200" r="70" fill="#ffe37a" opacity="0.3"/>
          <g class="fs-clouds" fill="#fff">
            <g class="fs-cloud c1"><ellipse cx="200" cy="110" rx="70" ry="26"/><ellipse cx="240" cy="92" rx="44" ry="30"/><ellipse cx="170" cy="98" rx="34" ry="22"/></g>
            <g class="fs-cloud c2"><ellipse cx="760" cy="70" rx="60" ry="22"/><ellipse cx="792" cy="54" rx="36" ry="24"/></g>
            <g class="fs-cloud c3"><ellipse cx="520" cy="170" rx="48" ry="17"/><ellipse cx="545" cy="158" rx="28" ry="18"/></g>
          </g>
          <path d="M0 380 Q 180 300 380 350 T 820 330 T 1280 350 V720 H0Z" fill="url(#fsHill1)"/>
          <!-- cối xay gió -->
