            <path d="M150 60 H206 M150 100 H206 M150 140 H206" stroke="#b7bfca" stroke-width="3"/>
            <path d="M-10 70 L80 0 L170 70 V175 H-10Z" fill="#cf3f33" stroke="#7d1f19" stroke-width="4" stroke-linejoin="round"/>
            <path d="M-22 76 L80 -8 L182 76" fill="none" stroke="#fff4e0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="45" y="95" width="70" height="80" fill="#9c2c24" stroke="#fff4e0" stroke-width="5"/><path d="M45 95 L115 175 M115 95 L45 175" stroke="#fff4e0" stroke-width="5"/>
            <rect x="62" y="38" width="36" height="28" fill="#fff4e0" stroke="#7d1f19" stroke-width="3"/>
